# This file is managed by 'fullsend repos': repos-config-v1
# Do not edit this file directly; changes will be overwritten.
version: "1"
runtime: claude
agents:
    - name: code
      runtime: claude
      model: opus
    - name: fix
      model: sonnet
    - name: prioritize
      runtime: pi
      model: google-vertex/gemini-3.8-flash
    - name: review
      runtime: pi
      model: sonnet
      subagents:
        challenger: opus
        correctness: gateway/gpt-6.1-sol
        docs-currency: google-vertex/gemini-3.8-flash
        intent-coherence: google-vertex/gemini-3.8-flash
        risk-assessment: google-vertex/gemini-3.8-flash
        security: gateway/gpt-6.1-sol
        style-conventions: google-vertex/gemini-3.8-flash
    - name: retro
      enabled: true
      model: sonnet
      trigger: event.transition.kind == "comment_added" && has(event.transition.comment.command) && event.transition.comment.command == "/fs-retro" && event.actor.kind == "human"
    - name: triage
      model: sonnet
    - source: https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/572ba470c8d1e539516620adcc92bbee1863a3a1/harness/qualityflow.yaml#sha256=c0a51b2f75172aebd577fd38c8012a7c566a84f84812ebd9aa4cc07ad3b2220e
allowed_remote_resources:
    - https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/
create_issues:
    allow_targets:
        orgs:
            - fullsend-ai
status_notifications:
    reaction:
        start: enabled
        completion: enabled
inference:
    gateway:
        url: https://fullsend-inference-gateway-155031062349.us-central1.run.app
        audience: fullsend-inference-gateway
        models:
            gpt-6.1-sol:
                api: openai-responses
