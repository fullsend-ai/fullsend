# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
runtime: claude
# What the `sonnet` alias means in this repo, for the parent run of every agent
# on both runtimes and for pi sub-agents. fullsend's pinned default is one
# generation older; Vertex enables models per project, so this only works
# where claude-sonnet-5 is served (a pinned alias has no fallback).
models:
    aliases:
        sonnet: claude-sonnet-5
roles:
    - fullsend
    - triage
    - coder
    - review
    - retro
    - prioritize
agents:
    - source: https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/572ba470c8d1e539516620adcc92bbee1863a3a1/harness/qualityflow.yaml#sha256=c0a51b2f75172aebd577fd38c8012a7c566a84f84812ebd9aa4cc07ad3b2220e
    - name: code
      runtime: pi
      model: xai/grok-4.6
    - name: fix
      model: sonnet
    - name: prioritize
      runtime: pi
      model: google-vertex/gemini-3.8-flash
    - name: review
      runtime: pi
      model: sonnet
      subagents:
        challenger: xai/grok-4.6
        correctness: xai/grok-4.6
        docs-currency: google-vertex/gemini-3.8-flash
        intent-coherence: google-vertex/gemini-3.8-flash
        risk-assessment: google-vertex/gemini-3.8-flash
        security: xai/grok-4.6
        style-conventions: google-vertex/gemini-3.8-flash
    - name: retro
      model: sonnet
    - name: triage
      model: sonnet
allowed_remote_resources:
    - https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/
create_issues:
    allow_targets:
        orgs:
            - fullsend-ai
        repos:
            - fullsend-ai/fullsend
status_notifications:
  reaction:
    start: enabled
    completion: enabled
