title: "First page of /items endpoint skips the first 10 items"
body: |
  ## Bug description

  When fetching the first page of items from the `/items` endpoint, the first 10 items are missing. Page 1 returns items 11–20 instead of items 1–10, and page 2 returns items 21–25 instead of 11–20.

  ## Steps to reproduce

  1. Start the server: `go run main.go`
  2. Request page 1:
     ```
     curl "http://localhost:8080/items?page=1&per_page=10"
     ```
  3. Observe the response contains `item-11` through `item-20` instead of `item-1` through `item-10`.

  ## Expected behavior

  `?page=1&per_page=10` should return the first 10 items (`item-1` through `item-10`).

  ## Actual behavior

  `?page=1&per_page=10` returns `item-11` through `item-20`. The first page of results is completely skipped.
