# Seed config for pre-commit hook environment pre-population at image-build time.
#
# Lists only the external repos from .pre-commit-config.yaml — local hooks are
# repo-specific (they call gofmt, go vet, lychee, custom scripts, etc.) and
# cannot be pre-built into the image.
#
# At image build time pre-commit install-hooks clones each repo and builds its
# virtualenv/Go binary here. At runtime the sandbox egress policy blocks raw
# git-over-HTTPS fetches (HTTP 403), so without this pre-population every
# agent run would fall back to per-hook manual reimplementation (#7298).
#
# Keep revs in sync with the root .pre-commit-config.yaml.
# A mismatch causes pre-commit to re-clone at runtime — defeating the purpose.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks: [{id: end-of-file-fixer}]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks: [{id: gitlint}]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks: [{id: ruff}]

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks: [{id: bandit}]

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks: [{id: gitleaks}]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks: [{id: shellcheck}]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks: [{id: actionlint}]
