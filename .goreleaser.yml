version: 2

git:
  # Ignore major-version floating tags (v0, v1, ...) so they don't
  # confuse GoReleaser's previous-tag detection for changelogs.
  ignore_tags:
    - v0
    - v1
    - v2

builds:
  - main: ./cmd/fullsend/
    binary: fullsend
    ldflags:
      - -s -w -X github.com/fullsend-ai/fullsend/internal/buildinfo.version={{.Version}} -X github.com/fullsend-ai/fullsend/internal/buildinfo.commitSHA={{.FullCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^ci(\(.*\))?:'
      - '^docs(\(.*\))?:'
      - '^test(\(.*\))?:'
      - '^chore(\(.*\))?:'
      - '^build(\(.*\))?:'
      - '^style(\(.*\))?:'
  # Groups match in list order and the first match wins, so Breaking
  # Changes must stay first to pull `!` commits out of the type groups.
  groups:
    - title: Breaking Changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]+\))??!?:.+$'
      order: 1
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))??!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\([^)]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  github:
    owner: fullsend-ai
    name: fullsend
  name_template: "{{ .Tag }}{{ if and .TagSubject (ne .TagSubject .Tag) }}: {{ .TagSubject }}{{ end }}"
  prerelease: auto
  # The changelog above lists fullsend commits only. The agents release
  # for the same tag (created by release.yml's tag-agents job) carries the
  # agents changelog, so link it from every release.
  footer: |
    ## Agents changes

    The fleet agents ship in [fullsend-ai/agents {{ .Tag }}](https://github.com/fullsend-ai/agents/releases/tag/{{ .Tag }}); its release notes list the agents changes in this release.

announce:
  slack:
    enabled: true
    channel: "#forum-konflux-fullsend"
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
