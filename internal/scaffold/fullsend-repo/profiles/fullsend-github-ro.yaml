---
id: fullsend-github-ro
display_name: Fullsend GitHub (read-only)
description: Read-only GitHub API access for fullsend agents
category: source_control
credentials:
  - name: api_token
    description: GitHub token used by the gh CLI
    env_vars: [GH_TOKEN]
    required: true
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: api.github.com
    port: 443
    protocol: graphql
    access: read-only
    enforcement: enforce
    path: "/graphql"
  - host: github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - "**/gh"
  - "**/node"
