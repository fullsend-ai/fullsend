---
id: fullsend-atlassian-cloud
display_name: Fullsend Atlassian Cloud
description: Atlassian Cloud API access for fullsend agents
category: data
endpoints:
  # Accepted risk: wildcard permits egress to any Atlassian Cloud tenant,
  # not just the org's own instance. Per-tenant scoping requires OpenShell
  # profile templating, which is not yet supported. Revisit when OpenShell
  # gains that capability.
  - host: "*.atlassian.net"
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - "**/curl"
  - "**/node"
