---
# Template, not imported as-is: the runner renders it per configured gateway
# host and auth mode for the claude runtime (renderGatewayProfileFor in
# internal/cli/run_gateway_egress.go), replacing the placeholders below and
# suffixing the id with the mode and a hash of the host, so two gateways, or
# two modes, on one shared OpenShell gateway never share a profile id.
id: fullsend-inference-gateway-claude
display_name: Fullsend inference gateway (Claude Code)
description: Inference gateway for the claude runtime (runner-seeded, run-scoped credential)
category: inference
credentials:
  - name: api_token
    description: Run-scoped inference gateway credential (forge OIDC token or gateway API key)
    env_vars: [INFERENCE_GATEWAY_API_KEY]
    required: true
    # The header Claude Code sends the credential in: Authorization: Bearer
    # from the oidc mode's apiKeyHelper, x-api-key from ANTHROPIC_API_KEY in
    # the api-key mode. OpenShell resolves the placeholder wherever it
    # appears on a request to the endpoint below.
    auth_style: __INFERENCE_GATEWAY_AUTH_STYLE__
    header_name: __INFERENCE_GATEWAY_HEADER_NAME__
    refresh:
      strategy: external
# Explicit allow rules instead of an `access:` preset: headless Claude Code
# calls only the two Messages API paths below, and a preset would admit every
# other path on the host. `path` limits the credential binding to the model
# API prefix; without it OpenShell binds every path on host:port.
endpoints:
  - host: __INFERENCE_GATEWAY_HOST__
    port: 443
    path: /v1/**
    protocol: rest
    enforcement: enforce
    # OpenShell 0.0.110+ resets any inspected request body that contains the
    # literal placeholder prefix (NVIDIA/OpenShell#2904). Model bodies never
    # legitimately carry a placeholder, so forward bodies uninspected; the
    # credential header is still resolved and the method/path rules still
    # apply.
    allow_uninspected_credentials: true
    rules:
      - allow:
          method: POST
          path: /v1/messages
      - allow:
          method: POST
          path: /v1/messages/count_tokens
# The sandbox image's Claude Code binary is .../claude-code/bin/claude.exe, so
# **/claude alone does not match it.
binaries:
  - "**/claude"
  - "**/claude.exe"
  - "**/node"
