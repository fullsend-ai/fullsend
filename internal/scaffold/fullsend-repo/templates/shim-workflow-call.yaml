---
# --- fullsend managed below - do not edit ---
# lint-workflow-size: max-lines=280
# fullsend shim workflow (workflow_call mode)
# Routes events to agent workflows in .fullsend via workflow_call.
# No secrets are needed in the enrolled repo — agents fetch scoped tokens
# from the centralized token mint using GitHub OIDC.
#
# Security: pull_request_target runs the BASE branch version of this workflow,
# preventing PRs from modifying it to exfiltrate credentials.
# This shim never checks out PR code, so it is not vulnerable to "pwn request"
# attacks.
#
# __ORG__ is replaced by reconcile-repos.sh at deploy time.
#
# Routing: this shim forwards the raw event context to dispatch.yml, which
# determines the stage from event_type + event_action + payload fields.
# Adding a new stage requires only a case branch in dispatch.yml — zero
# changes to enrolled repos.
name: fullsend

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, ready_for_review, closed, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  dispatch:
    concurrency:
      # Label-derived suffix for labeled events so routing labels
      # get isolated concurrency slots (#2452).
      group: >-
        fullsend-dispatch-${{ github.event.issue.number || github.event.pull_request.number }}-${{
          github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'dispatch'
        }}
      cancel-in-progress: false
    if: >-
      (github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review'
       || github.event.pull_request.head.ref != 'fullsend/scaffold-install')
      && (github.event_name != 'issue_comment'
       || github.event.comment.user.type != 'Bot')
      && (
        github.event.action != 'labeled'
        || startsWith(github.event.label.name, 'ready-')
      )
    permissions:
      actions: write
      id-token: write
      contents: read
      pull-requests: read
    uses: __ORG__/.fullsend/.github/workflows/dispatch.yml@main
    with:
      event_action: ${{ github.event.action }}

  stop-agent:
    # Generalized /fs-stop <agent> (and /fs-fix-stop alias). Job-level if: is
    # intentionally coarse — authorization uses the collaborator permission API
    # + issue/PR-author escape hatch (ADR 0054 / #5421).
    # Match exact command tokens only (not /fs-stopper, /fs-stop-now, etc.).
    # fromJSON('"...\n"') is required: GHA single-quoted strings do not treat \n as newline.
    if: >-
      github.event_name == 'issue_comment'
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.body == '/fs-stop'
          || startsWith(github.event.comment.body, '/fs-stop ')
          || startsWith(github.event.comment.body, fromJSON('"/fs-stop\n"'))
          || startsWith(github.event.comment.body, fromJSON('"/fs-stop\r"'))
          || github.event.comment.body == '/fs-fix-stop'
          || startsWith(github.event.comment.body, '/fs-fix-stop ')
          || startsWith(github.event.comment.body, fromJSON('"/fs-fix-stop\n"'))
          || startsWith(github.event.comment.body, fromJSON('"/fs-fix-stop\r"'))
        )
    runs-on: __GH_RUNNER__
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Apply fullsend-no-* labels and notify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # ADR 0054: authorize via the collaborator permission API
          # (admin|maintain|write), not author_association — the latter grants
          # contributor status to anyone with a single merged PR (issue #5421).
          # Mirrors has_repo_permission() in dispatch.yml; keep the two in sync.
          # The issue/PR author may always stop agents on their own item.
          authorized=false
          if [[ -n "$COMMENT_USER_LOGIN" && "$COMMENT_USER_LOGIN" == "$ISSUE_USER_LOGIN" ]]; then
            authorized=true
          else
            if api_err=$(mktemp); then
              if role=$(gh api "repos/$REPO/collaborators/$COMMENT_USER_LOGIN/permission" \
                --jq '.role_name' 2>"$api_err"); then
                case "$role" in
                  admin|maintain|write) authorized=true ;;
                esac
              else
                echo "::warning::Permission API call failed for $COMMENT_USER_LOGIN: $(cat "$api_err")"
              fi
              rm -f "$api_err"
            else
              echo "::warning::Failed to create temp file for permission check of $COMMENT_USER_LOGIN"
            fi
          fi
          if [[ "$authorized" != "true" ]]; then
            echo "::notice::User $COMMENT_USER_LOGIN is not authorized to stop agents (requires write access or authorship)"
            exit 0
          fi

          FIRST="$(printf '%s\n' "${COMMENT_BODY}" | head -1 | tr -d '\r')"
          CMD="$(printf '%s\n' "${FIRST}" | awk '{print $1}')"
          ARG="$(printf '%s\n' "${FIRST}" | awk '{print $2}')"
          # Agents with auto-trigger paths gated by fullsend-no-* in dispatch.
          # prioritize is slash-only and has no auto-trigger to suppress.
          # Bare /fs-stop only applies labels meaningful for this item type.
          VALID_ALL="triage code review fix retro"
          VALID_ISSUE="triage code"
          VALID_PR="review fix retro"
          if [[ "${ISSUE_IS_PR}" == "true" ]]; then
            VALID_BARE="${VALID_PR}"
          else
            VALID_BARE="${VALID_ISSUE}"
          fi
          VALID="${VALID_ALL}"
          AGENTS=()
          CROSS_CONTEXT=false
          if [[ "${CMD}" == "/fs-fix-stop" ]]; then
            AGENTS=(fix)
            if [[ "${ISSUE_IS_PR}" != "true" ]]; then
              CROSS_CONTEXT=true
            fi
          elif [[ "${CMD}" == "/fs-stop" ]]; then
            if [[ -z "${ARG:-}" ]]; then
              # shellcheck disable=SC2206
              AGENTS=(${VALID_BARE})
            elif [[ "${ARG}" =~ ^[a-z]+$ ]] && [[ " ${VALID} " == *" ${ARG} "* ]]; then
              AGENTS=("${ARG}")
              if [[ "${ISSUE_IS_PR}" == "true" ]]; then
                if [[ " ${VALID_ISSUE} " == *" ${ARG} "* ]] && [[ " ${VALID_PR} " != *" ${ARG} "* ]]; then
                  CROSS_CONTEXT=true
                fi
              else
                if [[ " ${VALID_PR} " == *" ${ARG} "* ]] && [[ " ${VALID_ISSUE} " != *" ${ARG} "* ]]; then
                  CROSS_CONTEXT=true
                fi
              fi
            else
              BODY_FILE="$(mktemp)"
              {
                printf 'Unknown or unsupported agent.'
                printf ' Valid auto-stop targets: %s.' "${VALID}"
                printf ' Usage: `/fs-stop <agent>` or `/fs-stop` for all meaningful on this item.'
                printf ' Note: prioritize is slash-only (`/fs-prioritize`); there is no auto-trigger to stop.'
              } >"${BODY_FILE}"
              if [[ "${ISSUE_IS_PR}" == "true" ]]; then
                gh pr comment "${ISSUE_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}"
              else
                gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}"
              fi
              rm -f "${BODY_FILE}"
              exit 0
            fi
          else
            echo "::notice::Ignoring unrecognized stop command: ${CMD}"
            exit 0
          fi

          APPLIED=()
          for agent in "${AGENTS[@]}"; do
            label="fullsend-no-${agent}"
            gh label create "${label}" --repo "${REPO}" \
              --description "Skip auto-triggered ${agent} agent runs" --color "FBCA04" \
              --force 2>/dev/null || true
            if [[ "${ISSUE_IS_PR}" == "true" ]]; then
              if gh pr edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${label}"; then
                APPLIED+=("\`${label}\`")
              else
                echo "::warning::Failed to apply label ${label}"
              fi
            else
              if gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${label}"; then
                APPLIED+=("\`${label}\`")
              else
                echo "::warning::Failed to apply label ${label}"
              fi
            fi
          done

          BODY_FILE="$(mktemp)"
          if [[ "${#APPLIED[@]}" -eq 0 ]]; then
            printf 'Agent stop requested for #%s, but no labels were applied (label API calls failed — see workflow run logs).\n' \
              "${ISSUE_NUMBER}" >"${BODY_FILE}"
          else
            LIST="$(printf '%s, ' "${APPLIED[@]}")"
            LIST="${LIST%, }"
            {
              printf 'Agent stop applied for #%s: %s.\n' "${ISSUE_NUMBER}" "${LIST}"
              printf 'Auto-triggers for these agents are skipped while the label(s) remain.\n'
              printf 'On-demand `/fs-<agent>` commands still work.\n'
              printf 'In-flight runs are not cancelled by this command — remove the label(s) or re-run `/fs-<agent>` to continue.\n'
              if [[ "${CROSS_CONTEXT}" == "true" ]]; then
                printf 'Note: these labels only affect auto-triggers on *this* item; they do not carry over to a linked issue or PR.\n'
              fi
            } >"${BODY_FILE}"
          fi
          if [[ "${ISSUE_IS_PR}" == "true" ]]; then
            gh pr comment "${ISSUE_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}"
          else
            gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}"
          fi
          rm -f "${BODY_FILE}"
