---
# fullsend-component: pr-poll
# fullsend fork PR review poll caller (per-repo installation mode)
# `fullsend repos install` writes this workflow while the repository's
# effective fork_pr_review_poll.enabled is true, and removes it otherwise.
# The per-cycle and per-head limits come from .fullsend/config.yaml, never
# from this workflow.
#
# This caller owns only the schedule. reusable-poll-prs.yml lists open fork
# pull requests from authorized authors and returns the dispatch matrix; the
# dispatch job calls reusable-dispatch.yml once per entry, which checks the
# pull request again and runs the built-in review. Both are pinned to the same ref, so the poll and the review it
# starts always run one Fullsend version (ADR 62).
#
# since: is the time the poll was enabled, stamped when install first writes
# this file and kept on later converges. The poll starts no review for pull
# request activity from before it, so enabling the poll does not review a
# backlog (ADR 0171). Removing the file and enabling the poll again stamps
# a new time.
#
# Security: the poll job is read-only and receives no secrets; it reads pull
# requests with GITHUB_TOKEN only.
#
# Concurrency: overlapping poll cycles queue rather than cancel each other,
# so one cycle's starts are visible to the next.
name: fullsend fork PR review poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fullsend-poll-prs
  cancel-in-progress: false

permissions: {}

jobs:
  poll:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    uses: __REUSABLE_WORKFLOW__
    with:
      since: "__SINCE__"
      runner_image: __GH_RUNNER__
      timeout_minutes: 15

  # One reusable-dispatch run per pull request, named for the pull request
  # and head commit it reviews. The poll reads these job names back to tell
  # a running or failed review of a head commit from one not yet started.
  dispatch:
    name: Review (#${{ matrix.status_number }}@${{ matrix.event_payload.pull_request.head.sha }})
    needs: poll
    if: ${{ needs.poll.outputs.matrix != '' && fromJSON(needs.poll.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.poll.outputs.matrix) }}
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: __REUSABLE_DISPATCH__
    with:
      event_action: poll-review
      poll_review: ${{ toJSON(matrix) }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      runner_image: __GH_RUNNER__
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      FULLSEND_OPENAI_API_KEY: ${{ secrets.FULLSEND_OPENAI_API_KEY }}
      FULLSEND_INFERENCE_GATEWAY_API_KEY: ${{ secrets.FULLSEND_INFERENCE_GATEWAY_API_KEY }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      FULLSEND_GITHUB_RUNNER_SECRETS: ${{ secrets.FULLSEND_GITHUB_RUNNER_SECRETS }}
