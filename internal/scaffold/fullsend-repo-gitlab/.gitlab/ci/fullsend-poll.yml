---
spec:
  inputs:
    schedule_name:
      default: '$CI_PIPELINE_SCHEDULE_DESCRIPTION'
---
# fullsend-stage: poll

"$[[ inputs.schedule_name | expand_vars ]]":
  stage: poll
  image:
    name: ghcr.io/fullsend-ai/fullsend-runner:latest
    entrypoint: [""]
  tags: __RUNNER_TAGS__
  resource_group: "fullsend-poll-$FULLSEND_POLL_MODE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    FULLSEND_FORGE: "gitlab"
    FULLSEND_POLL_MODE: "events"
  before_script:
    - |
      set -euo pipefail
      # CI_DEBUG_TRACE guard — must run before any token-bearing
      # commands to prevent secret leakage via debug trace logging.
      if [ "${CI_DEBUG_TRACE:-}" = "true" ]; then
        echo "ERROR: CI_DEBUG_TRACE enabled — aborting to protect secrets"
        exit 1
      fi
      # Install fullsend CLI at the version pinned during
      # `fullsend repos install`. Mirrors the GitHub Actions
      # install-fullsend-cli action (#6445).
      FULLSEND_VERSION="__FULLSEND_VERSION__"
      FULLSEND_REPO="fullsend-ai/fullsend"
      # Resolve "latest" to the actual release tag.
      if [ "${FULLSEND_VERSION}" = "latest" ]; then
        # Use GITHUB_TOKEN when available to avoid GitHub API rate
        # limits (60 req/hr unauthenticated vs 5000 authenticated).
        FS_AUTH_HEADER=""
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          FS_AUTH_HEADER="Authorization: token ${GITHUB_TOKEN}"
        fi
        if ! FS_RELEASE_JSON=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          ${FS_AUTH_HEADER:+-H "${FS_AUTH_HEADER}"} \
          "https://api.github.com/repos/${FULLSEND_REPO}/releases/latest"); then
          echo "ERROR: Failed to fetch latest release from GitHub API"
          exit 1
        fi
        FULLSEND_VERSION=$(printf '%s' "${FS_RELEASE_JSON}" | jq -r '.tag_name')
        if [ -z "${FULLSEND_VERSION}" ] || [ "${FULLSEND_VERSION}" = "null" ]; then
          echo "ERROR: Could not resolve latest fullsend release tag"
          exit 1
        fi
      fi
      case "${FULLSEND_VERSION}" in
        v*)
          # Release version — download pre-built binary with checksum
          # verification from GitHub Releases.
          FS_VER="${FULLSEND_VERSION#v}"
          FS_ARCH="$(uname -m)"
          case "${FS_ARCH}" in
            x86_64)  FS_ARCH="amd64" ;;
            aarch64) FS_ARCH="arm64" ;;
            *)       echo "ERROR: unsupported architecture: ${FS_ARCH} (supported: x86_64, aarch64)"; exit 1 ;;
          esac
          FS_BASE="https://github.com/${FULLSEND_REPO}/releases/download/${FULLSEND_VERSION}"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            "${FS_BASE}/fullsend_${FS_VER}_linux_${FS_ARCH}.tar.gz" \
            -o /tmp/fullsend.tar.gz
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            "${FS_BASE}/checksums.txt" -o /tmp/checksums.txt
          FS_CHECKSUM_LINE=$(grep "fullsend_${FS_VER}_linux_${FS_ARCH}.tar.gz$" /tmp/checksums.txt || true)
          if [ -z "${FS_CHECKSUM_LINE}" ]; then
            echo "ERROR: checksum entry not found for fullsend_${FS_VER}_linux_${FS_ARCH}.tar.gz"
            exit 1
          fi
          echo "${FS_CHECKSUM_LINE}" \
            | sed "s|fullsend_${FS_VER}_linux_${FS_ARCH}.tar.gz|/tmp/fullsend.tar.gz|" \
            | sha256sum -c -
          tar xzf /tmp/fullsend.tar.gz -C /usr/local/bin fullsend
          rm -f /tmp/fullsend.tar.gz /tmp/checksums.txt
          ;;
        *)
          # Untagged SHA — clone and build from source (Go toolchain
          # is in the runner base image for this purpose).
          if ! command -v go >/dev/null 2>&1; then
            echo "ERROR: Go 1.20+ toolchain not found — required for source builds (non-release refs)"
            echo "Use a runner image with Go 1.20+ installed or pin to a release version tag"
            exit 1
          fi
          export GOPATH="${RUNNER_TEMP:-/tmp}/go"
          export GOCACHE="${RUNNER_TEMP:-/tmp}/go-cache"
          FSSRC=$(mktemp -d)
          git init "${FSSRC}"
          git -C "${FSSRC}" remote add origin "https://github.com/${FULLSEND_REPO}.git"
          git -C "${FSSRC}" fetch --depth 1 origin "${FULLSEND_VERSION}"
          git -C "${FSSRC}" checkout FETCH_HEAD
          CGO_ENABLED=0 go build -C "${FSSRC}" \
            -ldflags "-X github.com/fullsend-ai/fullsend/internal/cli.version=${FULLSEND_VERSION}" \
            -o /usr/local/bin/fullsend ./cmd/fullsend/
          rm -rf "${FSSRC}"
          ;;
      esac
      fullsend --version
  script:
    - |
      set -euo pipefail

      # CI_DEBUG_TRACE guard — prevents PAT exposure via debug trace logging.
      if [ "${CI_DEBUG_TRACE:-}" = "true" ]; then
        echo "ERROR: CI_DEBUG_TRACE enabled — aborting to protect secrets"
        exit 1
      fi

      # Bot token from FULLSEND_FORGE_TOKEN CI/CD variable (per ADR-0067).

      if [ -z "${FULLSEND_FORGE_TOKEN:-}" ]; then
        echo "ERROR: FULLSEND_FORGE_TOKEN is not set — ensure the protected CI/CD variable is configured"
        exit 1
      fi

      # Validate FULLSEND_POLL_MODE before use in URLs and commands.
      case "${FULLSEND_POLL_MODE:-events}" in
        slash|events) ;;
        *)
          echo "ERROR: FULLSEND_POLL_MODE must be 'slash' or 'events', got '${FULLSEND_POLL_MODE:-}'"
          exit 1
          ;;
      esac

      # Resource group self-heal — set process_mode so stale locks from
      # cancelled/deleted pipelines are preempted by new jobs.
      # slash mode: newest_first (latest command wins)
      # events mode: oldest_first (complete long-running discovery)
      # Best-effort: failures don't block the job.
      PROCESS_MODE="newest_first"
      if [ "${FULLSEND_POLL_MODE:-events}" = "events" ]; then
        PROCESS_MODE="oldest_first"
      fi
      curl -sf --retry 2 --retry-delay 1 --retry-all-errors \
        -X PUT "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/resource_groups/fullsend-poll-${FULLSEND_POLL_MODE:-events}" \
        -H "PRIVATE-TOKEN: ${FULLSEND_FORGE_TOKEN}" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "process_mode=${PROCESS_MODE}" > /dev/null 2>&1 || true

      # Run the poller — dispatches pipelines directly via the GitLab API.
      # No child pipeline generation needed: the poller creates standalone
      # pipelines for each discovered event and logs clickable URLs.
      fullsend poll \
        --forge gitlab \
        --project "${CI_PROJECT_PATH}" \
        --gitlab-url "${FULLSEND_GITLAB_URL:-${CI_SERVER_URL}}" \
        --fullsend-dir .fullsend \
        --mode "${FULLSEND_POLL_MODE:-events}"
