---
spec:
  inputs:
    schedule_name:
      default: '$CI_PIPELINE_SCHEDULE_DESCRIPTION'
---
# fullsend-stage: poll

"$[[ inputs.schedule_name | expand_vars ]]":
  stage: poll
  image:
    name: ghcr.io/fullsend-ai/fullsend-runner:dev
    entrypoint: [""]
  tags: __CONTROL_RUNNER_TAGS__
  resource_group: "fullsend-poll-$FULLSEND_POLL_MODE"
  rules:
    # Deny-before-admit: GitLab evaluates rules first-match, so a
    # debug-trace pipeline must not reach the schedule admit rule.
    # Secrets materialize at job init; a script-level abort is too late.
    # Matches the full truthy set gitlab-runner accepts for this
    # variable (Go strconv.ParseBool: "1", "t"/"T", "true"/"TRUE"/"True").
    - if: $CI_DEBUG_TRACE =~ /^(1|t|true)$/i
      when: never
    # Select mode from GitLab's schedule identity, not pipeline variables,
    # which no_one_allowed prohibits. No extra root input is needed.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_DEBUG_TRACE !~ /^(1|t|true)$/i && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "fullsend slash poll"
      variables:
        FULLSEND_POLL_MODE: "slash"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_DEBUG_TRACE !~ /^(1|t|true)$/i && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "fullsend event poll"
      variables:
        FULLSEND_POLL_MODE: "events"
  variables:
    FULLSEND_FORGE: "gitlab"
    FULLSEND_POLL_MODE: "events"
  before_script:
    - . "${CI_PROJECT_DIR:-.}/.gitlab/ci/scripts/install-fullsend-cli.sh"
  script:
    - . "${CI_PROJECT_DIR:-.}/.gitlab/ci/scripts/run-poll-job.sh"
