---
# Fullsend CI pipeline — include directives and stage declarations.
#
# This file is managed by fullsend. Do not edit it directly.
# The root .gitlab-ci.yml includes this file via:
#   include:
#     - local: '.gitlab/ci/fullsend-pipeline.yml'
#
# A version-marker comment is injected at install/upgrade time so
# `repos status` and drift detection can identify the installed
# scaffold version. Repos enrolled before #7707 may still carry that
# marker in the obsolete fullsend-dispatch.yml stub; converge
# migrates it here.
#
# The workflow: block lives in the root .gitlab-ci.yml because GitLab
# does not merge multiple workflow: definitions across includes.

include:
  - local: '.gitlab/ci/fullsend-poll.yml'
    rules:
      # Deny-before-admit (ADR 0125): debug-trace must not reach the
      # schedule include. Job-level rules repeat this guard. Matches
      # the full truthy set gitlab-runner accepts for this variable
      # (Go strconv.ParseBool: "1", "t"/"T", "true"/"TRUE"/"True").
      - if: $CI_DEBUG_TRACE =~ /^(1|t|true)$/i
        when: never
      - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_DEBUG_TRACE !~ /^(1|t|true)$/i
  # Native merge_request_event dispatch (fullsend-dispatch.yml) was
  # removed in #7322, and the leftover stub was dropped in #7707. All
  # events route through the cron poller, which creates standalone
  # pipelines via the API; those run .gitlab-ci.yml with STAGE set and
  # include the agent template via the rule below.
  - local: '.gitlab/ci/fullsend-agent.yml'
    rules:
      - if: $CI_DEBUG_TRACE =~ /^(1|t|true)$/i
        when: never
      - if: $CI_PIPELINE_SOURCE == "api" && $STAGE && $CI_DEBUG_TRACE !~ /^(1|t|true)$/i

stages:
  # Native MR dispatch was removed in #7322. The empty 'dispatch' stage
  # was dropped from this list in #7337; uninstall and converge still
  # strip it from already-enrolled repos via obsoleteGitLabStages.
  - poll
  - agent
