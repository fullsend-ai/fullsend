---
# Fullsend CI pipeline — include directives and stage declarations.
#
# This file is managed by fullsend. Do not edit it directly.
# The root .gitlab-ci.yml includes this file via:
#   include:
#     - local: '.gitlab/ci/fullsend-pipeline.yml'
#
# The workflow: block lives in the root .gitlab-ci.yml because GitLab
# does not merge multiple workflow: definitions across includes.

include:
  - local: '.gitlab/ci/fullsend-poll.yml'
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"
  # Native merge_request_event dispatch (fullsend-dispatch.yml) was
  # removed in #7322. All events route through the cron poller, which
  # creates standalone pipelines via the API; those run .gitlab-ci.yml
  # with STAGE set and include the agent template via the rule below.
  - local: '.gitlab/ci/fullsend-agent.yml'
    rules:
      - if: $CI_PIPELINE_SOURCE == "api" && $STAGE

stages:
  # 'dispatch' is a retained no-op stage: native MR dispatch was removed in
  # #7322 and no job uses it anymore, but it stays in the list (and in
  # fullsendStages) so uninstall/drift detection continues to recognize and
  # clean it up on already-enrolled repos. GitLab silently skips empty stages.
  - dispatch
  - poll
  - agent
