---
spec:
  inputs:
    stage:
      default: '$STAGE'
---
# Generic agent stage template — parameterized by $STAGE.
# A single template handles all agent stages (triage, code, review, fix,
# retro, prioritize). The cron-poller's API-triggered pipeline sets
# STAGE as a pipeline variable; this template reads it to select the
# agent.
#
# Job behavior lives in .gitlab/ci/scripts/run-agent-job.sh so the
# shell can be linted and tested independently of this YAML.

stages:
  - agent

"fullsend $[[ inputs.stage | expand_vars ]] agent":
  stage: agent
  image:
    name: ghcr.io/fullsend-ai/fullsend-runner:dev
    entrypoint: [""]
  tags: __RUNNER_TAGS__
  id_tokens:
    FULLSEND_ID_TOKEN:
      aud: "fullsend"
  variables:
    FULLSEND_FORGE: "gitlab"
    CODE_ALLOWED_TARGET_BRANCHES: ''
  before_script:
    - . "${CI_PROJECT_DIR:-.}/.gitlab/ci/scripts/install-fullsend-cli.sh"
  script:
    - . "${CI_PROJECT_DIR:-.}/.gitlab/ci/scripts/run-agent-job.sh"
  artifacts:
    when: always
    paths:
      - output/
    expire_in: 1 week
  resource_group: "fullsend-${STAGE}-${RESOURCE_KEY}"
  rules:
    - if: $STAGE
