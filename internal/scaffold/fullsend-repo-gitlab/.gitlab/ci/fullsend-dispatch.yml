# fullsend-stage: dispatch (removed)
#
# Native merge_request_event dispatch was removed in #7322. After #7293
# moved MR-open review onto the cron poller, the only remaining native
# path was best-effort closed → retro (a push-then-close race). All
# GitLab events now route through the cron poller on the protected
# default branch (fullsend-poll.yml), including closed-unmerged MRs.
#
# This file is retained as the version-marker carrier for status and
# upgrade drift detection (see CollectGitLabPerRepoInstallFiles). It is
# not included by fullsend-pipeline.yml.
