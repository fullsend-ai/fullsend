# Written by fullsend (CodexRuntime.Bootstrap); do not edit.
# Integrity-checked before every iteration — see buildCodexRunCommand.
model_provider = "fullsend-openai"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "disabled"
check_for_update_on_startup = false
hide_agent_reasoning = false
developer_instructions = """
# Agent: review

Review a pull request.

You are the review agent. Dispatch the roster.

## Runtime note

This agent runs on the codex runtime (FULLSEND_RUNTIME=codex). Registered sub-agent roles: correctness, default, explore. Sub-agents are native Codex children. When a skill says to dispatch a sub-agent, call `spawn_agent` with `agent_type` set to a role listed above — the persona's name, or `explore` where the skill asks for an `Explore` pass (instruction-only; nothing enforces read-only on a child); for a task that names no persona, omit `agent_type` — and `message` carrying that sub-agent's whole context package: a child starts with nothing but that message. Pass `fork_context: false` explicitly on every spawn, and never pass a `model` or `reasoning_effort` argument: the runner has bound each role's model. Use only the roles listed above; `explorer` and `worker` are not registered and are denied. Spawn only the sub-agents the skill selected; a role being registered is not a reason to spawn it.

At most four children can be open at once, and a finished child keeps its slot until it is closed. Start up to four, `wait_agent` on one child at a time (one target id per call), `close_agent` each child once it has reported, then start the remaining ones. Close every child you spawned and never resume one. A `wait_agent` that returns `timed_out: true` and no status has timed out, not failed: call it again. A child whose status is `errored` is final for that role. A denied spawn is final for that role: do not retry it, execute that sub-agent definition yourself with the same context package, and treat the output as that sub-agent's result.

When reading a SKILL.md or other instruction file, do not cat it in one call: Codex truncates exec output (head and tail, dropping the middle). For each file, count its lines with `awk 'END { print NR }' <file>` (`wc -l` misses a last line with no newline), then `sed -n '<start>,<end>p'` in contiguous ranges of at most 200 lines, one range per tool call, including a short final chunk so the last line is covered — do not round the line count down to a multiple of 200 (a 425-line file is three ranges: `1,200p`, `201,400p`, `401,425p`). Never combine files or ranges in one exec. Inspect the returned output for a truncation warning before advancing; if a range is truncated, split it into smaller contiguous windows that together still cover its start through end — never skip the back half — and read those windows before moving on to the next range.
"""

[analytics]
enabled = false

[feedback]
enabled = false

[history]
persistence = "none"

[skills.bundled]
enabled = false

[features]
plugins = false
multi_agent_v2 = false

[agents]
enabled = true
max_concurrent_threads_per_session = 4
max_depth = 1
default_subagent_model = "gpt-5.6-luna"

[agents."correctness"]
description = "Evaluates logic correctness, edge cases, nil handling, API contracts, test adequacy/integrity."
config_file = "/sandbox/codex-config/agents/correctness.toml"

[agents."default"]
description = "Generic sub-agent for a task the parent describes in full in its message."
config_file = "/sandbox/codex-config/agents/default.toml"

[agents."explore"]
description = "Investigation of the repository by reading only; reports findings. Instruction-only: nothing enforces read-only on a child."
config_file = "/sandbox/codex-config/agents/explore.toml"

[projects."/sandbox/workspace/repo"]
trust_level = "untrusted"

[model_providers.fullsend-openai]
name = "OpenAI via the fullsend run-scoped provider"
base_url = "https://api.openai.com/v1"
wire_api = "responses"

[model_providers.fullsend-openai.auth]
command = "/sandbox/codex-config/openai-token.sh"
refresh_interval_ms = 30000
timeout_ms = 5000
