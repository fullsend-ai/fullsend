# Environments for this repo, managed by safe-settings full-sync. This run
# is scoped to this repository only (see deployment-settings.yml); everything
# else -- rulesets, repository settings -- stays managed by the org repo's
# safe-settings run (github.com/fullsend-ai/org).
# Environments are total-state: unlisted ones are deleted on apply. The
# same goes for per-environment variables, reviewers, wait timers, and
# protection rules -- anything added later through the GitHub UI is removed
# by the next run. Edit this file, not the UI.
environments:
  - name: dev
  - name: e2e-org-pool
    # safe-settings cannot manage environment secrets; these three live only on
    # GitHub (write-only via the API): TEST_ACTOR_TRIAGE_PAT,
    # TEST_ACTOR_WRITE_PAT, TEST_BOTSEND_PAT.
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies:
        - main
  - name: evals
  - name: forgejo-dev
  - name: forgejo-stage
  - name: functional-tests
  - name: github-pages
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies:
        - main
  - name: site-preview
  - name: site-production
  - name: stage
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies:
        - main
