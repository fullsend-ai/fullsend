title: "Role request: [role] — [your GitHub username]"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Role Request

        Use this form to request a contributor role upgrade. See
        [LADDER.md](https://github.com/fullsend-ai/fullsend/blob/main/LADDER.md)
        for role definitions, criteria, and approval requirements.

        **Write in your own words.** Do not have an AI generate this request.

  - type: dropdown
    id: tier
    attributes:
      label: Requested role
      description: Which role are you requesting?
      options:
        - triage
        - write
    validations:
      required: true

  - type: textarea
    id: contributions
    attributes:
      label: Contribution history
      description: >
        Link to merged PRs, substantive reviews, or other evidence of
        your familiarity with the project. For write access, show
        contributions across different areas or deep expertise in a
        specific subsystem.
      placeholder: |
        - https://github.com/fullsend-ai/fullsend/pull/NNN
        - https://github.com/fullsend-ai/fullsend/pull/NNN
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why do you need this role?
      description: >
        Explain what you plan to do with the additional capabilities
        (e.g., triaging issues, using mutation agents, reviewing PRs).
      placeholder: "I want to help triage incoming issues and..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I wrote this request myself (not AI-generated)
          required: true
        - label: I have read [LADDER.md](https://github.com/fullsend-ai/fullsend/blob/main/LADDER.md) and meet the criteria for this role
          required: true
