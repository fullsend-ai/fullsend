name: Mint Token
description: >-
  Exchange a GitHub OIDC token for a role-scoped installation token via the
  fullsend token mint. Requires id-token: write permission on the calling job.

inputs:
  role:
    description: Agent role name (e.g. triage, coder, review, fullsend)
    required: true
  repos:
    description: Comma-separated repo names to scope the token to
    required: true
  level:
    description: >-
      Privilege level for the minted token (e.g. read, write).
      Defaults to write for backward compatibility — the server defaults
      omitted levels to read, so callers that need write must pass it explicitly.
    required: false
    default: write
  mint_url:
    description: URL of the token mint (typically from vars.FULLSEND_MINT_URL)
    required: true

outputs:
  token:
    description: Scoped GitHub installation token
    value: ${{ steps.mint.outputs.token }}

runs:
  using: composite
  steps:
    - name: Mint token via OIDC
      id: mint
      shell: bash
      env:
        MINT_URL: ${{ inputs.mint_url }}
        ROLE: ${{ inputs.role }}
        REPOS: ${{ inputs.repos }}
        LEVEL: ${{ inputs.level }}
      run: |
        set -euo pipefail
        if [[ -z "$MINT_URL" ]]; then
          echo "::error::FULLSEND_MINT_URL is not set"
          exit 1
        fi
        echo "::add-mask::$MINT_URL"
        if [[ -z "$REPOS" ]]; then
          echo "::error::repos input is required"
          exit 1
        fi
        OIDC_TOKEN=$(curl -sSf --retry 3 --retry-delay 2 --retry-all-errors \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fullsend-mint" | jq -r '.value')
        if [[ -z "$OIDC_TOKEN" || "$OIDC_TOKEN" == "null" ]]; then
          echo "::error::Failed to obtain OIDC token"
          exit 1
        fi
        echo "::add-mask::$OIDC_TOKEN"
        REPOS_JSON=$(echo "$REPOS" | jq -Rc 'split(",") | map(select(length > 0))')
        BODY=$(jq -nc --arg role "$ROLE" --argjson repos "$REPOS_JSON" --arg level "$LEVEL" \
          '{role: $role, repos: $repos, level: $level}')
        echo "Requesting token: role=$ROLE level=$LEVEL repos=$REPOS"
        BODY_FILE=$(mktemp)
        trap 'rm -f "$BODY_FILE"' EXIT
        # -o / -w keep the JSON body off stdout so a failed request still
        # yields the HTTP status in HTTP_CODE. --fail-with-body (curl >=
        # 7.76, present on GitHub-hosted runners) still writes the response
        # body to BODY_FILE on a non-2xx status, unlike plain -f/--fail,
        # which discards it. --retry-all-errors keeps retrying 422.
        HTTP_CODE=$(curl -sS --fail-with-body -o "$BODY_FILE" -w "%{http_code}" \
          --retry 5 --retry-delay 5 --retry-all-errors \
          -H "Authorization: Bearer $OIDC_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$BODY" \
          "${MINT_URL}/v1/token") || {
          if [[ "$HTTP_CODE" == "422" ]]; then
            printf '%s\n' "::error::A 422 error code usually means the GitHub App configured for role \"$ROLE\" is not installed for the repository. Check if it is installed in certain selected repositories."
          fi
          exit 1
        }
        MINT_RESPONSE=$(cat "$BODY_FILE")
        echo "::add-mask::$MINT_RESPONSE"
        TOKEN=$(echo "$MINT_RESPONSE" | jq -r '.token')
        if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "::error::Token mint returned no token for role=$ROLE"
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        GRANTED_REPOS=$(echo "$MINT_RESPONSE" | jq -r '.granted_repos | if . then map(strings) | join(",") else empty end')
        GRANTED_PERMS=$(echo "$MINT_RESPONSE" | jq -r '.granted_permissions | if . then to_entries | map("\(.key)=\(.value)") | join(",") else empty end')
        REPO_SELECTION=$(echo "$MINT_RESPONSE" | jq -r '.repository_selection // empty')
        echo "Granted scope: repos=${GRANTED_REPOS:-} permissions=${GRANTED_PERMS:-} repo_selection=${REPO_SELECTION:-}"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
