name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    needs: [validate-agents, resolve-agents]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Move v0 floating tag
        if: "!contains(github.ref_name, '-')"
        run: |
          set -euo pipefail
          CURRENT=""
          if git rev-parse v0 >/dev/null 2>&1; then
            CURRENT=$(git rev-parse v0)
            if ! git merge-base --is-ancestor "${CURRENT}" "${GITHUB_SHA}"; then
              echo "::warning::v0 already points at a newer commit, skipping"
              exit 0
            fi
          fi
          git tag -f v0 "${GITHUB_SHA}"
          if [[ -n "${CURRENT}" ]]; then
            git push --force-with-lease="v0:${CURRENT}" origin v0
          else
            git push origin v0
          fi

  validate-agents:
    needs: resolve-agents
    # Permission contract of the called workflow. GitHub validates this at
    # parse time, before any job runs or `if:` is evaluated — a called
    # workflow may only downgrade the caller's grants, so every permission
    # any of its jobs declares must be granted here even when that job is
    # skipped for this event (missing grants fail the whole run as
    # startup_failure; see #6512, run 32615313246):
    #   contents: read       — checkouts
    #   id-token: write      — GCP WIF auth in functional-tests
    #   pull-requests: write — gate job (pull_request_target only; skipped
    #                          on tag pushes, but still validated)
    #   checks: read         — functional-tests-complete roll-up job
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: read
    uses: fullsend-ai/agents/.github/workflows/functional-tests.yml@beed20e7e85f7f7cf9678a78fd1f440755560ca3 # main (includes agents#1010 cross-repo checkout fix)
    with:
      fullsend_ref: ${{ github.ref_name }}
    secrets:
      E2E_GCP_WIF_PROVIDER: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
      E2E_GCP_SERVICE_ACCOUNT: ${{ secrets.E2E_GCP_SERVICE_ACCOUNT }}
      E2E_GCP_PROJECT_ID: ${{ secrets.E2E_GCP_PROJECT_ID }}
      # Fine-grained PAT scoped to the eval org — used by functional
      # tests to read eval repos and record eval run results.
      EVAL_GH_TOKEN: ${{ secrets.EVAL_GH_TOKEN }}

  resolve-agents:
    # Resolve agents main once at release start. Since agents#1010 the gate
    # itself reports the SHA it validated (validate-agents' agents_sha
    # output), and tag-agents prefers that; this job's resolution is the
    # fallback if that output is ever empty, and the input for the
    # informational pin-drift check below (#6512).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      agents_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_INFO=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
          TAG_TYPE=$(jq -r '.object.type' <<<"${TAG_INFO}")
          TAG_SHA=$(jq -r '.object.sha' <<<"${TAG_INFO}")
          if [[ "${TAG_TYPE}" == "tag" ]]; then
            TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.object.sha')
          fi
          if [[ "${TAG_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Release tag ${TAG} resolves to ${TAG_SHA}, expected ${EXPECTED_SHA}"
            exit 1
          fi
          echo "Release tag ${TAG} resolves to ${EXPECTED_SHA}"

      - name: Resolve agents main
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(gh api repos/fullsend-ai/agents/git/ref/heads/main --jq '.object.sha')
          if [[ ! "${SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Could not resolve fullsend-ai/agents main to a commit SHA"
            exit 1
          fi
          echo "Resolved fullsend-ai/agents main to ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Gate pin drift check (informational)
        # Loud, not blocking: a stale pin means validate-agents exercises an
        # older agents tree than the one being tagged. Bumping the pin is a
        # maintainer decision (#6512), so this only annotates the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-agents-gate-pin.sh

  tag-agents:
    # Sync the version tag to fullsend-ai/agents. Runs for all tags
    # including pre-releases — agents' own release.yml handles
    # pre-release semantics. Only runs after agents functional tests
    # pass against the release tag. Tags the SHA the gate actually
    # validated (validate-agents' agents_sha output, agents#1010), falling
    # back to the SHA resolve-agents captured at release start — never
    # re-resolves main here (#6512).
    needs: [release, validate-agents, resolve-agents]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate agents repo token
        id: agents-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: agents

      - name: Push tag to fullsend-ai/agents
        env:
          GH_TOKEN: ${{ steps.agents-token.outputs.token }}
          GATE_SHA: ${{ needs.validate-agents.outputs.agents_sha }}
          RESOLVED_SHA: ${{ needs.resolve-agents.outputs.agents_sha }}
        run: |
          set -euo pipefail
          AGENTS_SHA="${GATE_SHA:-${RESOLVED_SHA}}"
          if [[ ! "${AGENTS_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::no usable agents SHA (gate='${GATE_SHA//::/}' resolved='${RESOLVED_SHA//::/}')"
            exit 1
          fi
          if [[ -n "${GATE_SHA}" && "${GATE_SHA}" != "${RESOLVED_SHA}" ]]; then
            echo "::notice::tagging the gate-validated SHA ${GATE_SHA} (agents main was ${RESOLVED_SHA} at release start)"
          fi
          echo "Tagging fullsend-ai/agents at ${AGENTS_SHA} (source: $([[ -n "${GATE_SHA}" ]] && echo validate-agents || echo resolve-agents))"
          TAG="${GITHUB_REF_NAME}"

          HTTP_CODE=$(gh api "repos/fullsend-ai/agents/git/ref/tags/${TAG}" \
            --include 2>/dev/null | head -1 | awk '{print $2}') || true
          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "Tag ${TAG} already exists on fullsend-ai/agents, skipping"
            exit 0
          elif [[ "${HTTP_CODE}" != "404" ]]; then
            echo "::error::Unexpected response (HTTP ${HTTP_CODE}) checking tag on fullsend-ai/agents"
            exit 1
          fi

          gh api repos/fullsend-ai/agents/git/refs \
            -f ref="refs/tags/${TAG}" \
            -f sha="${AGENTS_SHA}"
          echo "Created tag ${TAG} on fullsend-ai/agents at ${AGENTS_SHA}"

  notify-agents-sync-failure:
    needs: [release, validate-agents, resolve-agents, tag-agents]
    if: >-
      always()
      && needs.release.result == 'success'
      && (needs.validate-agents.result == 'failure'
          || needs.resolve-agents.result == 'failure'
          || needs.tag-agents.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(jq -n --arg tag "${GITHUB_REF_NAME}" --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{text: ":warning: Agents tag sync failed for `\($tag)`. The fullsend release shipped but the agents tag was not created. <\($url)|View run>"}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$SLACK_WEBHOOK"
