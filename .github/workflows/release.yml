name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    needs: [validate-agents, resolve-agents, recheck-tag]
    runs-on: ubuntu-24.04
    # pull-requests: read is needed by release-notes generate, which reads
    # merged PR bodies to gather the release-note blocks.
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    # Historically ~2 minutes. Bounded so a hung publish cannot hold the
    # tag-agents sync (and the default 6h limit) open.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # A final tag can share its commit with the release candidate it
      # promotes (vX.Y.Z and vX.Y.Z-rc.N on one commit). GoReleaser picks
      # the current tag from `git tag --points-at HEAD`, so without this it
      # can choose the rc tag and fail re-uploading the rc's assets
      # (v0.44.0, run 36944759050). Pin the current tag to the pushed ref.
      # For a final, the previous tag is the last final, so the changelog
      # spans the whole release instead of only the commits since the rc.
      - name: Resolve GoReleaser tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "GORELEASER_CURRENT_TAG=${TAG}" >> "$GITHUB_ENV"
          case "$TAG" in
            *-*) exit 0 ;;
          esac
          TAGS=$(git tag --merged "${TAG}^{commit}" --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*')
          PREV=$(printf '%s\n' "$TAGS" | grep -v -e '-' | grep -vxF -e "$TAG" | head -n1 || true)
          if [ -n "$PREV" ]; then
            echo "GORELEASER_PREVIOUS_TAG=${PREV}" >> "$GITHUB_ENV"
          fi
          echo "current=${TAG} previous=${PREV:-<goreleaser default>}"

      # Release notes come from `release-note` blocks in PR bodies (see
      # COMMITS.md, "Release notes"), gathered with the Kubernetes
      # release-notes tool — the same approach kubearchive uses. The tool
      # reads the blocks from the merged PRs in the tag range, skips NONE
      # entries, and renders markdown. GoReleaser then publishes that
      # markdown instead of its commit-subject changelog.
      - name: Install release-notes
        env:
          # SHA-256 of release-notes-amd64-linux from the v0.17.1 release.
          # Update the URL and this digest together (see
          # scripts/renovate/ for the checksum-pinning convention).
          RELEASE_NOTES_SHA256: 16e0ada3e3602c229e97fa789ea97c7d128710d7fe1fee9f12c00f7eaa770d6a
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/release-notes" \
            https://github.com/kubernetes/release/releases/download/v0.17.1/release-notes-amd64-linux
          echo "${RELEASE_NOTES_SHA256}  ${RUNNER_TEMP}/release-notes" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/release-notes"
          sudo mv "${RUNNER_TEMP}/release-notes" /usr/local/bin/release-notes

      - name: Generate release notes from PR bodies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Previous tag: for a final release, the last final release, so
          # the notes span the whole release. For an rc, the tag
          # immediately before this one (usually the previous rc), so an
          # rc only lists what changed since that tag — matching
          # GoReleaser's default previous-tag resolution for rc tags.
          TAGS=$(git tag --merged "${TAG}^{commit}" --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*')
          case "${TAG}" in
            *-*) PREV=$(printf '%s\n' "$TAGS" | grep -vxF -e "$TAG" | head -n1 || true) ;;
            *)   PREV=$(printf '%s\n' "$TAGS" | grep -v -e '-' | grep -vxF -e "$TAG" | head -n1 || true) ;;
          esac
          if [[ -z "${PREV}" ]]; then
            # Static message: interpolating TAG here would need workflow-command
            # escaping (%0A/%0D) to stay injection-safe.
            echo "::error::Could not find a previous release tag before the current tag"
            exit 1
          fi
          echo "Gathering notes from ${PREV} to ${TAG}"
          # The tool lists commits from START_SHA's commit date onward
          # (inclusive). Use the first first-parent commit after PREV:
          # picking the oldest-dated commit in the range would open the
          # window before PREV (PR-branch commits can carry dates older
          # than PREV) and re-list PRs from the previous release.
          RANGE=$(git rev-list --first-parent --reverse "${PREV}..${TAG}")
          if [[ -n "${RANGE}" ]]; then
            START_SHA=$(head -n1 <<<"${RANGE}")
          else
            # PREV and TAG share a commit (a re-tag); fall back to PREV.
            START_SHA=$(git rev-list -n1 "${PREV}")
          fi
          END_SHA=$(git rev-list -n1 "${TAG}")
          export START_SHA END_SHA
          # The tool reads its range and branch from these env vars. Use
          # the tag's SHA as the listing ref (the `sha` parameter accepts
          # a SHA): listing from main would include PRs merged to main
          # after the tag but dated inside the window. --required-author=""
          # includes bot-authored PRs (agents open many of our PRs). Write
          # outside the checkout: GoReleaser refuses a dirty git tree.
          export BRANCH="${END_SHA}"
          # Gather as JSON, then render with our own script. The tool
          # credits a commit to any PR cited as "(#N)" in its message, so
          # PRs from earlier releases can appear; the renderer keeps only
          # PRs actually merged in the range (first-parent commits between
          # PREV and TAG) and groups notes by PR title type, mirroring the
          # old GoReleaser changelog layout.
          release-notes generate \
            --required-author="" \
            --dependencies=false \
            --format json \
            --output "${RUNNER_TEMP}/release-notes.json" \
            --org fullsend-ai --repo fullsend
          # PRs merged in this release: merge commits say "Merge pull
          # request #N"; squash-merge subjects end with "(#N)".
          git log --first-parent --format='%s' "${PREV}..${TAG}" \
            | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p; s/.*\(#([0-9]+)\)$/\1/p' \
            | sort -u > "${RUNNER_TEMP}/merged-prs.txt"
          # Titles for the gathered PRs (one cheap API call each; only PRs
          # with a release-note block reach this list).
          : > "${RUNNER_TEMP}/pr-titles.tsv"
          while read -r pr; do
            gh pr view "${pr}" --json number,title \
              --jq '"\\(.number)\\t\\(.title)"' >> "${RUNNER_TEMP}/pr-titles.tsv"
          done < <(jq -r 'keys[]' "${RUNNER_TEMP}/release-notes.json")
          bash scripts/render-release-notes.sh \
            "${RUNNER_TEMP}/release-notes.json" \
            "${RUNNER_TEMP}/merged-prs.txt" \
            "${RUNNER_TEMP}/pr-titles.tsv" \
            > "${RUNNER_TEMP}/release-notes-body.md"
          # Prepend the header prepend-release-highlights.sh expects, so
          # the release-highlights step keeps working with the
          # gathered-notes body.
          printf '## Changelog\n\n' | cat - "${RUNNER_TEMP}/release-notes-body.md" \
            > "${RUNNER_TEMP}/release-notes.md"

      # GoReleaser signs the release here. Installed CLIs only accept a
      # signature made by this workflow file, for the tag, on a
      # GitHub-hosted runner (internal/selfupdate/verify.go). Renaming this
      # file or moving this step to another workflow breaks
      # `fullsend self-update`.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          # --release-notes replaces the changelog with the markdown
          # gathered from PR bodies above. The path is outside the
          # checkout so the git tree stays clean.
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Move v0 floating tag
        if: "!contains(github.ref_name, '-')"
        run: |
          set -euo pipefail
          CURRENT=""
          if git rev-parse v0 >/dev/null 2>&1; then
            CURRENT=$(git rev-parse v0)
            if ! git merge-base --is-ancestor "${CURRENT}" "${GITHUB_SHA}"; then
              echo "::warning::v0 already points at a newer commit, skipping"
              exit 0
            fi
          fi
          git tag -f v0 "${GITHUB_SHA}"
          if [[ -n "${CURRENT}" ]]; then
            git push --force-with-lease="v0:${CURRENT}" origin v0
          else
            git push origin v0
          fi

  validate-agents:
    needs: resolve-agents
    # Permission contract of the called workflow. GitHub validates this at
    # parse time, before any job runs or `if:` is evaluated — a called
    # workflow may only downgrade the caller's grants, so every permission
    # any of its jobs declares must be granted here even when that job is
    # skipped for this event (missing grants fail the whole run as
    # startup_failure; see #6512, run 32615313246):
    #   contents: read       — checkouts
    #   id-token: write      — GCP WIF auth in functional-tests
    #   pull-requests: write — gate job (pull_request_target only; skipped
    #                          on tag pushes, but still validated)
    #   checks: read         — functional-tests-complete roll-up job
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: read
    uses: fullsend-ai/agents/.github/workflows/functional-tests.yml@291d391532ad223218e5594e9c3d9ecf41909d33 # main (schema v2 OpenShell gateway config + Podman socket, agents#1513)
    with:
      fullsend_ref: ${{ github.ref_name }}
    secrets:
      E2E_GCP_WIF_PROVIDER: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
      E2E_GCP_SERVICE_ACCOUNT: ${{ secrets.E2E_GCP_SERVICE_ACCOUNT }}
      E2E_GCP_PROJECT_ID: ${{ secrets.E2E_GCP_PROJECT_ID }}
      # Fine-grained PAT scoped to the eval org — used by functional
      # tests to read eval repos and record eval run results.
      EVAL_GH_TOKEN: ${{ secrets.EVAL_GH_TOKEN }}

  resolve-agents:
    # Resolve agents main once at release start. Since agents#1010 the gate
    # itself reports the SHA it validated (validate-agents' agents_sha
    # output), and tag-agents prefers that; this job's resolution is the
    # fallback if that output is ever empty, and the input for the
    # informational pin-drift check below (#6512).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      agents_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Pinned to the commit, not the tag: the guard below must not run a
      # copy of itself fetched through the mutable ref it is checking.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # First half of the tag-move guard — see the recheck-tag job.
      - name: Verify release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-release-tag.sh

      # validate-agents is only a real gate while the functional tests
      # actually run. In the called workflow an empty E2E_GCP_WIF_PROVIDER
      # makes the "Check for secrets" step log a warning, skip GCP auth and
      # every test step, and still report success — which, now that the
      # binary is published only after that gate, would ship a release that
      # validated nothing. Fail the release loudly instead of silently
      # degrading to no coverage.
      - name: Verify agents gate secrets
        env:
          WIF_PROVIDER: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          if [[ -z "${WIF_PROVIDER}" ]]; then
            echo "::error::E2E_GCP_WIF_PROVIDER is not configured — agents functional tests would skip and the release gate would pass without running a single test"
            exit 1
          fi
          echo "::notice::E2E_GCP_WIF_PROVIDER is configured; the agents gate will run its tests"

      - name: Resolve agents main
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(gh api repos/fullsend-ai/agents/git/ref/heads/main --jq '.object.sha')
          if [[ ! "${SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Could not resolve fullsend-ai/agents main to a commit SHA"
            exit 1
          fi
          echo "Resolved fullsend-ai/agents main to ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Gate pin drift check (informational)
        # Loud, not blocking: a stale pin means validate-agents exercises an
        # older agents tree than the one being tagged. Bumping the pin is a
        # maintainer decision (#6512), so this only annotates the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-agents-gate-pin.sh

  recheck-tag:
    # Second half of the tag-move guard. validate-agents clones fullsend by
    # tag name — the called workflow only accepts `main` or a `v*` ref and
    # uses `git clone --branch`, so it cannot be pinned to a SHA from this
    # side. A tag moved during the ~45 minutes of functional tests would
    # otherwise leave the gate validating one commit while GoReleaser
    # publishes another. resolve-agents checks the tag before validation
    # starts; this checks it again after, so publication requires the tag
    # to have been stable across the whole gate.
    #
    # Its own job rather than a step inside `release` so that a tag moved
    # mid-gate stays a *pre-publication* failure: nothing has shipped, and
    # notify-release-blocked can say so.
    needs: validate-agents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Pinned to the commit, not the tag — see resolve-agents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-release-tag.sh

  tag-agents:
    # Sync the version tag to fullsend-ai/agents. Runs for all tags
    # including pre-releases — agents' own release.yml handles
    # pre-release semantics. Only runs after agents functional tests
    # pass against the release tag. Tags the SHA the gate actually
    # validated (validate-agents' agents_sha output, agents#1010), falling
    # back to the SHA resolve-agents captured at release start — never
    # re-resolves main here (#6512).
    needs: [release, validate-agents, resolve-agents]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate agents repo token
        id: agents-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: agents

      - name: Push tag to fullsend-ai/agents
        env:
          GH_TOKEN: ${{ steps.agents-token.outputs.token }}
          GATE_SHA: ${{ needs.validate-agents.outputs.agents_sha }}
          RESOLVED_SHA: ${{ needs.resolve-agents.outputs.agents_sha }}
        run: |
          set -euo pipefail
          AGENTS_SHA="${GATE_SHA:-${RESOLVED_SHA}}"
          if [[ ! "${AGENTS_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::no usable agents SHA (gate='${GATE_SHA//::/}' resolved='${RESOLVED_SHA//::/}')"
            exit 1
          fi
          if [[ -n "${GATE_SHA}" && "${GATE_SHA}" != "${RESOLVED_SHA}" ]]; then
            echo "::notice::tagging the gate-validated SHA ${GATE_SHA} (agents main was ${RESOLVED_SHA} at release start)"
          fi
          echo "Tagging fullsend-ai/agents at ${AGENTS_SHA} (source: $([[ -n "${GATE_SHA}" ]] && echo validate-agents || echo resolve-agents))"
          TAG="${GITHUB_REF_NAME}"

          HTTP_CODE=$(gh api "repos/fullsend-ai/agents/git/ref/tags/${TAG}" \
            --include 2>/dev/null | head -1 | awk '{print $2}') || true
          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "Tag ${TAG} already exists on fullsend-ai/agents, skipping"
            exit 0
          elif [[ "${HTTP_CODE}" != "404" ]]; then
            echo "::error::Unexpected response (HTTP ${HTTP_CODE}) checking tag on fullsend-ai/agents"
            exit 1
          fi

          gh api repos/fullsend-ai/agents/git/refs \
            -f ref="refs/tags/${TAG}" \
            -f sha="${AGENTS_SHA}"
          echo "Created tag ${TAG} on fullsend-ai/agents at ${AGENTS_SHA}"

  notify-release-blocked:
    # Pre-publication failure: nothing shipped. Before the gate moved ahead
    # of GoReleaser this path did not exist — a validation failure still
    # published the binary and Slack reported only the missing agents tag.
    # Now the whole release stops here, so it needs its own signal;
    # otherwise a blocked release is silent on Slack.
    needs: [validate-agents, resolve-agents, recheck-tag]
    if: >-
      always()
      && (needs.validate-agents.result == 'failure'
          || needs.resolve-agents.result == 'failure'
          || needs.recheck-tag.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret is not configured"
            exit 1
          fi
          PAYLOAD=$(jq -n --arg tag "${GITHUB_REF_NAME}" --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{text: ":no_entry: Release `\($tag)` was blocked before publishing — tag verification or agents functional tests failed. No binary was published and no tags were moved. <\($url)|View run>"}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$SLACK_WEBHOOK"

  notify-agents-sync-failure:
    # Post-publication failure: the binary shipped but the agents tag did
    # not follow. validate-agents and resolve-agents are no longer checked
    # here — `release` depends on both, so its success already implies they
    # passed, and their failure is reported by notify-release-blocked.
    needs: [release, tag-agents]
    if: >-
      always()
      && needs.release.result == 'success'
      && needs.tag-agents.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret is not configured"
            exit 1
          fi
          PAYLOAD=$(jq -n --arg tag "${GITHUB_REF_NAME}" --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{text: ":warning: Agents tag sync failed for `\($tag)`. The fullsend release shipped but the agents tag was not created. <\($url)|View run>"}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$SLACK_WEBHOOK"
