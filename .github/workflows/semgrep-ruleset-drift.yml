name: Semgrep Ruleset Drift

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      expected: ${{ steps.compare.outputs.expected }}
      actual: ${{ steps.compare.outputs.actual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a newer upstream rules commit
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          RULESET_COMMIT_FILE: scripts/semgrep-ruleset-commit
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < "$RULESET_COMMIT_FILE")"
          actual="$(gh api repos/semgrep/semgrep-rules/commits/develop --jq .sha)"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ || ! "$actual" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected and upstream commits must be full lowercase Git SHAs" >&2
            exit 1
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "actual=$actual" >> "$GITHUB_OUTPUT"
          if [[ "$actual" == "$expected" ]]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: compare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The report only queries or updates one tracking issue.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create, update, or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RULESET_DRIFT: ${{ needs.compare.outputs.drift }}
          RULESET_EXPECTED: ${{ needs.compare.outputs.expected }}
          RULESET_ACTUAL: ${{ needs.compare.outputs.actual }}
        run: |
          set -euo pipefail
          title="Semgrep ruleset drift"
          issue="$(gh issue list --repo fullsend-ai/fullsend --state open --author app/github-actions --search "in:title $title" --json number,title,body --jq 'map(select(.title == "Semgrep ruleset drift" and ((.body // "") | contains("<!-- fullsend-semgrep-ruleset-drift -->")))) | .[0].number // empty')"

          if [[ "$RULESET_DRIFT" == "true" ]]; then
            body_file="$(mktemp)"
            trap 'rm -f "$body_file"' EXIT
            cat > "$body_file" <<EOF
          <!-- fullsend-semgrep-ruleset-drift -->

          The upstream semgrep/semgrep-rules develop branch has advanced past
          the rules commit used by Fullsend. Scans remain pinned until this
          update is reviewed and merged.

          - Pinned commit: $RULESET_EXPECTED
          - Current upstream commit: $RULESET_ACTUAL
          - Pin file: scripts/semgrep-ruleset-commit
          - Source: https://github.com/semgrep/semgrep-rules

          Review changes under security/audit/ and the scan results before
          updating the commit and archive SHA-256 pins.
          EOF
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --repo fullsend-ai/fullsend --body-file "$body_file"
            else
              gh issue create --repo fullsend-ai/fullsend --title "$title" --body-file "$body_file"
            fi
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --repo fullsend-ai/fullsend --comment "The upstream rules commit matches the current pin again."
          fi
