name: Sandbox Images

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+*"
    branches:
      - main
    paths:
      - "images/sandbox/**"
      - "images/code/**"
      - ".github/workflows/sandbox-images.yml"
      - go.mod
      - go.sum
  pull_request:
    paths:
      - "images/sandbox/**"
      - "images/code/**"
      - ".github/workflows/sandbox-images.yml"
      - go.mod
      - go.sum
  workflow_dispatch:

# NOTE: GitHub Actions ignores `paths` filters on tag pushes, so every
# semver tag triggers a build.  This is intentional — the sandbox image
# is published alongside the CLI so consumers can pin both to the same
# version.  Branch pushes and PRs still respect the paths filter.

# Each platform builds on a native runner and pushes by digest only;
# the merge jobs then publish the multi-arch index under the tags below.
# No step pulls from Docker Hub, whose anonymous rate limit failed
# release builds (#8289): there is no QEMU (tonistiigi/binfmt), and the
# docker-container buildx driver runs BuildKit from mirror.gcr.io
# instead of docker.io/moby/buildkit. The docker driver cannot push by
# digest.
env:
  BUILDKIT_IMAGE: mirror.gcr.io/moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
  BASE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fullsend-sandbox
  CODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fullsend-code
  # Shared by every metadata step, so the per-platform labels and the
  # merged index tags come from one definition.
  IMAGE_TAGS: |
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=sha,prefix=
    type=raw,value=latest,enable={{is_default_branch}}
    type=raw,value=dev,enable=${{ github.event_name != 'pull_request' }}

jobs:
  build-base:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    # Native cold builds take about 4 minutes; headroom for a slow
    # registry or apt mirror without the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BASE_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/sandbox
          file: images/sandbox/Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.BASE_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-sandbox-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  # Publish the multi-arch fullsend-sandbox index and compute the base
  # image reference for build-code.
  # On push/dispatch: the immutable digest of the index just pushed.
  # On PR: the :dev tag (multi-arch, published by non-PR builds) so that
  # both platform legs of build-code can resolve a base image.
  merge-base:
    needs: build-base
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.ref.outputs.value }}
    steps:
      - name: Download digests
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-sandbox-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BASE_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Create and push manifest list
        if: github.event_name != 'pull_request'
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ env.BASE_IMAGE_NAME }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Never publish a partial index.
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "${count}" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${count}"
            exit 1
          fi
          for hex in *; do
            if ! grep -Eqx '[0-9a-f]{64}' <<<"${hex}"; then
              echo "::error::not a sha256 digest: ${hex}"
              exit 1
            fi
          done
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag=" + .' <<<"${META_JSON}")
          sources=()
          for hex in *; do
            sources+=("${IMAGE_NAME}@sha256:${hex}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          # Read the digest back through this commit's sha tag: other
          # runs can move dev/latest, but only this commit sets this tag.
          sha_tag="${IMAGE_NAME}:${GITHUB_SHA::7}"
          jq -e --arg t "${sha_tag}" 'any(.tags[]; . == $t)' <<<"${META_JSON}" >/dev/null \
            || { echo "::error::${sha_tag} is not among the published tags"; exit 1; }
          digest=$(docker buildx imagetools inspect "${sha_tag}" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no index digest for ${sha_tag}"; exit 1; }
          # Another run of the same commit (a release tag on an rc commit)
          # can move the sha tag. Fail unless the index read back holds
          # exactly the platform images this run pushed.
          # shellcheck disable=SC2016  # $self is a jq variable
          platform_digests='if .manifests then [.manifests[] | select(.platform.os != "unknown") | .digest] else [$self] end | .[]'
          want=$(for src in "${sources[@]}"; do
            docker buildx imagetools inspect --raw "${src}" | jq -r --arg self "${src#*@}" "${platform_digests}"
          done | sort)
          got=$(docker buildx imagetools inspect --raw "${IMAGE_NAME}@${digest}" | jq -r --arg self "${digest}" "${platform_digests}" | sort)
          if [ "${want}" != "${got}" ]; then
            echo "::error::${sha_tag} was moved by another run; expected ${want//$'\n'/ }, got ${got//$'\n'/ }"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Compute base image ref
        id: ref
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          IMAGE_NAME: ${{ env.BASE_IMAGE_NAME }}
        run: |
          if [ -n "$DIGEST" ]; then
            echo "value=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${IMAGE_NAME}:dev" >> "$GITHUB_OUTPUT"
          fi

  build-code:
    needs: merge-base
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    # Native cold builds take about 4 minutes; headroom for a slow
    # registry or apt mirror without the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CODE_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/code
          file: images/code/Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.merge-base.outputs.image-ref }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.CODE_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=code-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=code-${{ matrix.arch }}

      # Load the image locally so we can smoke-test PATH ordering on this
      # platform. Reuses the build cache from the step above.
      - name: Build code image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/code
          file: images/code/Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: fullsend-code:ci-smoke
          build-args: |
            BASE_IMAGE=${{ needs.merge-base.outputs.image-ref }}
          cache-from: type=gha,scope=code-${{ matrix.arch }}

      - name: Validate PATH security
        run: |
          docker run --rm --entrypoint '' fullsend-code:ci-smoke sh -c '
            LAST=$(echo "$PATH" | tr ":" "\n" | tail -1)
            [ "$LAST" = "/sandbox/go/bin" ] || { echo "FAIL: /sandbox/go/bin not last (got $LAST)"; exit 1; }
            [ "$(command -v git)" = "/usr/bin/git" ] || { echo "FAIL: git shadowed ($(command -v git))"; exit 1; }
            [ "$(command -v scan-secrets)" = "/usr/local/bin/scan-secrets" ] || { echo "FAIL: scan-secrets shadowed ($(command -v scan-secrets))"; exit 1; }
          '

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-code-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  # Publish the multi-arch fullsend-code index once both platform legs
  # have built, pushed and passed the smoke test.
  merge-code:
    needs: build-code
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-code-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CODE_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ env.CODE_IMAGE_NAME }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Never publish a partial index.
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "${count}" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${count}"
            exit 1
          fi
          for hex in *; do
            if ! grep -Eqx '[0-9a-f]{64}' <<<"${hex}"; then
              echo "::error::not a sha256 digest: ${hex}"
              exit 1
            fi
          done
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag=" + .' <<<"${META_JSON}")
          sources=()
          for hex in *; do
            sources+=("${IMAGE_NAME}@sha256:${hex}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
