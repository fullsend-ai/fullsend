name: Sandbox Images

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+*"
    branches:
      - main
    paths:
      - "images/sandbox/**"
      - "images/code/**"
  pull_request:
    paths:
      - "images/sandbox/**"
      - "images/code/**"
  workflow_dispatch:

# NOTE: GitHub Actions ignores `paths` filters on tag pushes, so every
# semver tag triggers a build.  This is intentional — the sandbox image
# is published alongside the CLI so consumers can pin both to the same
# version.  Branch pushes and PRs still respect the paths filter.

jobs:
  build-base:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.ref.outputs.value }}
    env:
      BASE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fullsend-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BASE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/sandbox
          file: images/sandbox/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      # Compute a single image reference for the build-code job.
      # On push/dispatch: use the immutable digest from the pushed manifest list.
      # On PR: use the :dev tag (multi-arch, published by workflow_dispatch)
      # so that both platform legs can resolve a base image.
      - name: Compute base image ref
        id: ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ${{ env.BASE_IMAGE_NAME }}
        run: |
          if [ -n "$DIGEST" ]; then
            echo "value=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${IMAGE_NAME}:dev" >> "$GITHUB_OUTPUT"
          fi

  build-code:
    needs: build-base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fullsend-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CODE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/code
          file: images/code/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.image-ref }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=code
          cache-to: type=gha,mode=max,scope=code

      # Load a single-platform image locally so we can smoke-test PATH ordering.
      # Multi-arch builds cannot --load, so this reuses the GHA cache from above.
      - name: Build code image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/code
          file: images/code/Containerfile
          platforms: linux/amd64
          load: true
          tags: fullsend-code:ci-smoke
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.image-ref }}
          cache-from: type=gha,scope=code

      - name: Validate PATH security
        run: |
          docker run --rm --entrypoint '' fullsend-code:ci-smoke sh -c '
            LAST=$(echo "$PATH" | tr ":" "\n" | tail -1)
            [ "$LAST" = "/sandbox/go/bin" ] || { echo "FAIL: /sandbox/go/bin not last (got $LAST)"; exit 1; }
            [ "$(command -v git)" = "/usr/bin/git" ] || { echo "FAIL: git shadowed ($(command -v git))"; exit 1; }
            [ "$(command -v scan-secrets)" = "/usr/local/bin/scan-secrets" ] || { echo "FAIL: scan-secrets shadowed ($(command -v scan-secrets))"; exit 1; }
          '
