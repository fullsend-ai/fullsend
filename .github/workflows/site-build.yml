name: Build Site

on:
  pull_request:
    paths:
      - "web/**"
      - "docs/**"
      - "cloudflare_site/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "experiments"
      - "experiments/**"
      - ".gitmodules"
      - ".github/workflows/site-build.yml"
      - ".github/workflows/site-deploy.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "cloudflare_site/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "experiments"
      - "experiments/**"
      - ".gitmodules"
      - ".github/workflows/site-build.yml"
      - ".github/workflows/site-deploy.yml"

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build web SPAs
        run: npm run build

      - name: Build documentation site
        run: npm run docs:build

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p _bundle/public
          cp web/public/index.html _bundle/public/index.html
          cp web/public/graph.html _bundle/public/graph.html
          mkdir -p _bundle/public/assets
          cp -a web/dist/assets/. _bundle/public/assets/
          mkdir -p _bundle/public/admin
          cp -a web/dist/admin/. _bundle/public/admin/
          mkdir -p _bundle/public/docs
          cp -a docs/.vitepress/dist/. _bundle/public/docs/
          cp -a cloudflare_site/public/. _bundle/public/
          mkdir -p _bundle/worker
          cp -a cloudflare_site/worker/. _bundle/worker/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _bundle/
          retention-days: 5
