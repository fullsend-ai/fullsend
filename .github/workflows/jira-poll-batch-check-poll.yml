# Poll side of the Jira poll batch check (jira-poll-batch-check.yml).
#
# Stands in for reusable-poll-jira.yml. The poll job has that workflow's
# "Build dispatch matrix" step word for word and returns the matrix the same
# way: a step output, then the job's only output, then this workflow's output.
# What differs is where dispatches.json comes from: the batch job builds it
# with the real driver reading a fake Jira (hack/prove-jira-poll-batch).
#
# The record count, the digests and the sizes are outputs of the batch job,
# not of the poll job, so they still arrive when GitHub drops the matrix.
name: Jira poll batch check (poll)

on:
  workflow_call:
    inputs:
      case:
        description: Batch to build (a case of hack/prove-jira-poll-batch).
        type: string
        required: true
    outputs:
      matrix:
        description: Dispatch matrix, returned as reusable-poll-jira.yml returns it.
        value: ${{ jobs.poll.outputs.matrix }}
      count:
        description: Number of records in the batch.
        value: ${{ jobs.batch.outputs.count }}
      digests:
        description: JSON array with the digest of every record (jira-poll-record-digest.sh).
        value: ${{ jobs.batch.outputs.digests }}
      utf8_bytes:
        description: Size of the matrix in UTF-8.
        value: ${{ jobs.batch.outputs.utf8_bytes }}
      utf16_bytes:
        description: Size of the matrix in UTF-16, which is how GitHub approximates output size.
        value: ${{ jobs.batch.outputs.utf16_bytes }}

jobs:
  batch:
    name: Build the batch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      count: ${{ steps.describe.outputs.count }}
      digests: ${{ steps.describe.outputs.digests }}
      utf8_bytes: ${{ steps.describe.outputs.utf8_bytes }}
      utf16_bytes: ${{ steps.describe.outputs.utf16_bytes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run one poll cycle against a fake Jira
        env:
          CASE: ${{ inputs.case }}
          TARGET_REPO: ${{ github.repository }}
        run: go run ./hack/prove-jira-poll-batch -case "${CASE}" -target-repo "${TARGET_REPO}" -out dispatches.json

      - name: Describe the batch
        id: describe
        run: |
          set -euo pipefail
          matrix=$(jq -c '{include: .}' dispatches.json)
          digests=$(jq -c '.[]' dispatches.json | while IFS= read -r record; do
            printf '%s' "${record}" | .github/scripts/jira-poll-record-digest.sh
          done | jq -Rcs 'split("\n") | map(select(. != ""))')
          {
            echo "count=$(jq 'length' dispatches.json)"
            echo "digests=${digests}"
            echo "utf8_bytes=$(printf '%s' "${matrix}" | wc -c)"
            echo "utf16_bytes=$(printf '%s' "${matrix}" | iconv -f UTF-8 -t UTF-16LE | wc -c)"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dispatches
          path: dispatches.json
          retention-days: 7

  poll:
    name: Poll Jira
    needs: batch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dispatches

      - name: Build dispatch matrix
        id: matrix
        run: |
          set -euo pipefail
          jq -e 'type == "array"' dispatches.json > /dev/null
          if jq -e 'length == 0' dispatches.json > /dev/null; then
            echo "No dispatches."
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MATRIX=$(jq -c '{include: .}' dispatches.json)
          DELIM="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${DELIM}"
            printf '%s\n' "${MATRIX}"
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"
