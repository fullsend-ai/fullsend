name: Release Note Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-note-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch the PR body, title and commit subjects from the API rather
      # than the event payload so every trigger type (including `edited`)
      # sees the current state. Fork PRs work too: the PR object lives in
      # this repository.
      - name: Check release-note block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          PR_BODY=$(jq -r '.body // ""' <<<"${PR_JSON}")
          PR_TITLE=$(jq -r '.title // ""' <<<"${PR_JSON}")
          # Per-item jq transform with --paginate is safe; no cross-page
          # aggregation happens here (see docs/contributing/shell-scripting.md).
          COMMIT_SUBJECTS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | .commit.message | split("\n")[0]')
          PR_BODY="${PR_BODY}" PR_TITLE="${PR_TITLE}" COMMIT_SUBJECTS="${COMMIT_SUBJECTS}" \
            bash scripts/check-release-note.sh
