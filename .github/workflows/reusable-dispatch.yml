          FULLSEND_OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.FULLSEND_OPENAI_SERVICE_ACCOUNT_ID }}
          # Opt-in static key, used only when the three variables above are unset (ADR 0092).
          OPENAI_API_KEY: ${{ secrets.FULLSEND_OPENAI_API_KEY }}
          # Inference gateway API key for inference.gateway.auth api-key (ADR 0138),
          # read by the runner under its own name; unused in the oidc mode.
          FULLSEND_INFERENCE_GATEWAY_API_KEY: ${{ secrets.FULLSEND_INFERENCE_GATEWAY_API_KEY }}
        with:
          agent: code
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          runner_secrets: ${{ secrets.FULLSEND_GITHUB_RUNNER_SECRETS }}
