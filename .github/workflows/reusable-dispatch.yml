          status-number: ${{ fromJSON(needs.route.outputs.event_payload).issue.number }}
          mint-url: ${{ inputs.mint_url }}

  harness-dispatch:
    name: Harness dispatch
    if: ${{ inputs.matrix == '' }}
    runs-on: ${{ inputs.runner_image }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.dispatch.outputs.matrix }}
    steps:
      - name: Validate event_action
        if: ${{ inputs.event_action == '' }}
        run: |
          echo "::error::event_action is required when matrix is not provided"
          exit 1

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review') && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          sparse-checkout: |
            .fullsend/
            /OWNERS
            /OWNERS_ALIASES
            .defaults/action.yml
            .defaults/.github/actions/install-fullsend-cli/
            .fullsend/.defaults/action.yml
          sparse-checkout-cone-mode: false

      - name: Detect registered harness triggers
        id: triggers
        shell: bash
        run: |
          set -euo pipefail
          has_triggers=false
          if [[ -f .fullsend/config.yaml ]]; then
            if grep -qE 'source:[[:space:]]*https?://' .fullsend/config.yaml; then
              has_triggers=true
            elif grep -qE '^[[:space:]]*agents:' .fullsend/config.yaml \
              && grep -qE '^[[:space:]]*-[[:space:]]*name:|^[[:space:]]*name:' .fullsend/config.yaml; then
              # Agents are registered; let dispatch enumerate triggers. Skipping only
              # when the config has no agents avoids false negatives from harness path
              # layout while still skipping the CLI install on empty configs.
              has_triggers=true
            fi
          fi
          echo "has_triggers=${has_triggers}" >> "${GITHUB_OUTPUT}"

      - name: Detect dispatch CLI install mode
        id: mode
        if: steps.triggers.outputs.has_triggers == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .defaults/action.yml || -f .fullsend/.defaults/action.yml ]]; then
            echo "mode=vendored" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=upstream" >> "${GITHUB_OUTPUT}"
          fi

      - name: Guard vendored install
        if: steps.triggers.outputs.has_triggers == 'true' && steps.mode.outputs.mode == 'vendored'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .fullsend/bin/fullsend ]]; then
            echo "::error::broken --vendor install: vendored marker present but .fullsend/bin/fullsend is missing"
            exit 1
          fi

      - name: Restore fullsend CLI cache
        if: steps.triggers.outputs.has_triggers == 'true'
        id: cli-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fullsend-cache
          key: fullsend-cli-${{ steps.mode.outputs.mode }}-${{ job.workflow_sha }}

      - name: Install fullsend CLI (vendored defaults)
        if: steps.triggers.outputs.has_triggers == 'true' && steps.mode.outputs.mode == 'vendored' && steps.cli-cache.outputs.cache-hit != 'true'
        uses: ./.defaults/.github/actions/install-fullsend-cli
        with:
          mode: vendored
          vendored_path: .fullsend/bin/fullsend
          github_token: ${{ github.token }}

      - name: Checkout upstream install action
        if: steps.triggers.outputs.has_triggers == 'true' && steps.mode.outputs.mode == 'upstream' && steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflow-actions
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/install-fullsend-cli/
          sparse-checkout-cone-mode: false

      - name: Install fullsend CLI (upstream workflow)
        if: steps.triggers.outputs.has_triggers == 'true' && steps.mode.outputs.mode == 'upstream' && steps.cli-cache.outputs.cache-hit != 'true'
        uses: ./.workflow-actions/.github/actions/install-fullsend-cli
        with:
          mode: upstream
          workflow_repository: ${{ job.workflow_repository }}
          workflow_sha: ${{ job.workflow_sha }}
          github_token: ${{ github.token }}

      - name: Expose cached fullsend CLI
        if: steps.triggers.outputs.has_triggers == 'true' && steps.cli-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/fullsend"
          mkdir -p "${install_dir}"
          cp "${RUNNER_TEMP}/fullsend-cache/fullsend" "${install_dir}/fullsend"
          chmod +x "${install_dir}/fullsend"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Prepare fullsend CLI cache artifact
        if: steps.triggers.outputs.has_triggers == 'true' && steps.cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fullsend-cache"
          cp "${RUNNER_TEMP}/fullsend/fullsend" "${RUNNER_TEMP}/fullsend-cache/fullsend"

      - name: Save fullsend CLI cache
        if: steps.triggers.outputs.has_triggers == 'true' && steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fullsend-cache
          key: fullsend-cli-${{ steps.mode.outputs.mode }}-${{ job.workflow_sha }}

      - name: Run fullsend dispatch
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ inputs.event_action }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.triggers.outputs.has_triggers }}" != "true" ]]; then
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MATRIX=$(fullsend dispatch \
            --input-driver gha-event \
            --output-driver gha-matrix \
            --config-dir .fullsend \
            --event-action "${EVENT_ACTION}")
          DELIM="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${DELIM}"
            printf '%s' "${MATRIX}"
            echo
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"

  harness-run:
    name: Harness run (${{ matrix.agent }})
    needs: [harness-dispatch]
    if: ${{ !cancelled() && ((inputs.matrix != '' && fromJSON(inputs.matrix).include[0] != null) || (needs.harness-dispatch.outputs.matrix != '' && fromJSON(needs.harness-dispatch.outputs.matrix).include[0] != null)) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix != '' && inputs.matrix || (needs.harness-dispatch.outputs.matrix != '' && needs.harness-dispatch.outputs.matrix || '{"include":[]}')) }}
    concurrency:
      group: fullsend-harness-${{ matrix.agent }}-${{ github.repository }}-${{ matrix.status_repo }}-${{ matrix.status_number }}
      cancel-in-progress: true
    runs-on: ${{ inputs.runner_image }}
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review') && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - name: Checkout upstream defaults
        if: hashFiles('.defaults/action.yml', '.fullsend/.defaults/action.yml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .defaults
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/
            .github/scripts/
            internal/scaffold/fullsend-repo/
            action.yml

      - name: Prepare workspace (upstream defaults + repo overrides)
        run: |
          set -euo pipefail
          SRC=".defaults/internal/scaffold/fullsend-repo"
          LAYERED_DIRS="agents skills schemas harness plugins scripts env"
          DEST=".fullsend/"
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "${SRC}/${dir}" ]]; then
              mkdir -p "${DEST}${dir}"
              cp -r "${SRC}/${dir}/." "${DEST}${dir}/"
            fi
          done
          mkdir -p .github/scripts
          cp "${SRC}/.github/scripts/setup-agent-env.sh" .github/scripts/setup-agent-env.sh

      - name: Extract repo metadata
        id: repo-parts
        shell: bash
        env:
          SOURCE_REPO: ${{ matrix.source_repo }}
        run: |
          set -euo pipefail
          NAME="${SOURCE_REPO#*/}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"

      - name: Write dispatch event payload
        shell: bash
        env:
          EVENT_PAYLOAD: ${{ matrix.event_payload }}
        run: |
          set -euo pipefail
          mkdir -p .fullsend/dispatch
          printf '%s' "${EVENT_PAYLOAD}" > .fullsend/dispatch/event-payload.json

      - name: Mint agent token
        id: app-token
        uses: ./.defaults/.github/actions/mint-token
        with:
          role: ${{ matrix.role }}
          repos: ${{ steps.repo-parts.outputs.name }}
          mint_url: ${{ inputs.mint_url }}

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve bot identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          read -r BOT_LOGIN BOT_USER_ID < <(
            gh api graphql -f query='{ viewer { login databaseId } }' \
              | jq -r '.data.viewer | "\(.login) \(.databaseId)"'
          )
          GIT_BOT_EMAIL="${BOT_USER_ID}+${BOT_LOGIN}@users.noreply.github.com"
          echo "Resolved bot identity: ${BOT_LOGIN} (${BOT_USER_ID})"
          echo "GIT_BOT_EMAIL=${GIT_BOT_EMAIL}" >> "${GITHUB_ENV}"
          git config --global user.email "${GIT_BOT_EMAIL}"
          git config --global user.name "${BOT_LOGIN}"

      - name: Setup agent environment
        shell: bash
        env:
          MATRIX_ROLE: ${{ matrix.role }}
          GCP_PROJECT: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          GCP_REGION: ${{ inputs.gcp_region }}
          # Per-run runtime/model/effort overrides from repository variables
          # (FULLSEND_MODEL, <ROLE>_FULLSEND_MODEL, ...); see docs/runtimes.md.
          FULLSEND_REPO_VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          # GitHub Actions / bash identifiers cannot contain hyphens.
          # Map the role the same way mintcore.RoleIdentifier does: uppercase
          # and replace '-' with '_' so ci-check becomes CI_CHECK.
          ROLE_UPPER=$(echo "${MATRIX_ROLE}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          export AGENT_PREFIX="${ROLE_UPPER}_"
          export "${ROLE_UPPER}_TARGET_REPO_DIR=target-repo"
          export "${ROLE_UPPER}_ANTHROPIC_VERTEX_PROJECT_ID=${GCP_PROJECT}"
          export "${ROLE_UPPER}_CLOUD_ML_REGION=${GCP_REGION}"
          bash .github/scripts/setup-agent-env.sh

      - name: Export dispatch context env
        id: dispatch-env
        shell: bash
        env:
          EVENT_PAYLOAD: ${{ matrix.event_payload }}
        run: |
          set -euo pipefail
          URL=$(printf '%s' "${EVENT_PAYLOAD}" | jq -r '.issue.html_url // .pull_request.html_url // empty')
          if [[ -z "${URL}" ]]; then
            echo "::error::event_payload missing issue or pull_request html_url"
            exit 1
          fi
          WORK_ITEM_KEY=$(printf '%s' "${EVENT_PAYLOAD}" | jq -r '._normalized_event.entity.key // .issue.number // .pull_request.number // empty')
          if [[ -z "${WORK_ITEM_KEY}" ]]; then
            echo "::error::event_payload missing normalized entity key, issue number, or pull request number"
            exit 1
          fi
          ISSUE_NUMBER=$(printf '%s' "${EVENT_PAYLOAD}" | jq -r 'if ._normalized_event.source.system == "jira" then empty else (.issue.number // .pull_request.number // empty) end')
          DELIM="ISSUE_URL_$(openssl rand -hex 8)"
          {
            echo "issue_url<<${DELIM}"
            printf '%s' "${URL}"
            echo
            echo "${DELIM}"
            echo "work_item_key<<${DELIM}"
            printf '%s' "${WORK_ITEM_KEY}"
            echo
            echo "${DELIM}"
            echo "issue_number=${ISSUE_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run harness agent
        uses: ./.defaults/
        env:
          GITHUB_ISSUE_URL: ${{ steps.dispatch-env.outputs.issue_url }}
          FULLSEND_WORK_ITEM_URL: ${{ steps.dispatch-env.outputs.issue_url }}
          FULLSEND_WORK_ITEM_KEY: ${{ steps.dispatch-env.outputs.work_item_key }}
          ISSUE_NUMBER: ${{ steps.dispatch-env.outputs.issue_number }}
          REPO_FULL_NAME: ${{ matrix.source_repo }}
          FULLSEND_APP_SET: ${{ vars.FULLSEND_APP_SET || 'fullsend-ai' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_CERTIFICATE: ${{ vars.OTEL_EXPORTER_OTLP_CERTIFICATE }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
          OTEL_SDK_DISABLED: ${{ vars.OTEL_SDK_DISABLED }}
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${{ vars.OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT }}
          # OpenAI Workload Identity Federation for the pi runtime (ADR 0092):
          # non-secret identifiers the runner exchanges the job's OIDC token
          # against. Unset = the openai provider is not usable in this repo.
          FULLSEND_OPENAI_AUDIENCE: ${{ vars.FULLSEND_OPENAI_AUDIENCE }}
          FULLSEND_OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.FULLSEND_OPENAI_IDENTITY_PROVIDER_ID }}
          FULLSEND_OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.FULLSEND_OPENAI_SERVICE_ACCOUNT_ID }}
          # Opt-in static key, used only when the three variables above are unset (ADR 0092).
          OPENAI_API_KEY: ${{ secrets.FULLSEND_OPENAI_API_KEY }}
          # Inference gateway API key for inference.gateway.auth api-key (ADR 0138),
          # read by the runner under its own name; unused in the oidc mode.
          FULLSEND_INFERENCE_GATEWAY_API_KEY: ${{ secrets.FULLSEND_INFERENCE_GATEWAY_API_KEY }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: ${{ inputs.jira_base_url || vars.JIRA_BASE_URL }}
        with:
          agent: ${{ matrix.agent }}
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          role: ${{ matrix.role }}
          runner_secrets: ${{ secrets.FULLSEND_GITHUB_RUNNER_SECRETS }}
          version: ${{ inputs.fullsend_version || job.workflow_sha }}
          fullsend-dir: .fullsend
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status-repo: ${{ matrix.status_repo }}
          status-number: ${{ matrix.status_number }}
          status-comment-id: ${{ fromJSON(matrix.event_payload).comment.id }}
          mint-url: ${{ inputs.mint_url }}
          pr-head-sha: ${{ fromJSON(matrix.event_payload).pull_request.head.sha || '' }}
