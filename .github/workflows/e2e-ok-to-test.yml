name: E2E ok-to-test

# Maintainer-authorized e2e for fork PRs (#9245). Fork PRs get no secrets on
# pull_request, so E2E Tests skips their suites. A user with write access
# reviews the latest push and comments `/ok-to-test <sha>` on the PR, naming
# the reviewed commit; only a PR head that matches that sha runs. This is
# gh-aw's inline slash-command model: issue_comment plus a commenter role gate,
# with the workflow file always taken from the default branch.
#
# Called jobs report as "run / behaviour" on the default-branch commit, which
# the main ruleset does not read. So `authorize` creates check runs named
# behaviour, playback, and forgejo-behaviour on the authorized head sha, and
# `report` completes them from the suite results. Only these two jobs hold
# write scopes; the suite jobs that run PR code never do (gh-aw's safe-outputs
# split).
#
# `/ok-to-test <sha> live` also runs the live behaviour and playback jobs for
# that sha, as the merge queue does, and reports them as behaviour-live and
# playback-live. Those names are not required checks, so a live run on a PR
# never stands in for, or blocks on, the required behaviour and playback.
#
# No caller-level concurrency: e2e.yml queues /ok-to-test runs in its own
# e2e-ok-to-test-{n} group, and sharing a group with the callee deadlocks.

permissions: {}

on:
  issue_comment:
    types: [created]

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      !github.event.repository.fork &&
      startsWith(github.event.comment.body, '/ok-to-test')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      head_sha: ${{ steps.auth.outputs.head_sha }}
      live: ${{ steps.auth.outputs.live }}
      behaviour_live_check_id: ${{ steps.checks.outputs.behaviour_live }}
      playback_live_check_id: ${{ steps.checks.outputs.playback_live }}
      forgejo_behaviour_check_id: ${{ steps.checks.outputs.forgejo_behaviour }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}  # Default branch only — never check out PR head here
          persist-credentials: false

      # Commenter must have write+; authorizes the PR head only when it is the
      # sha the comment names. Posts the refusal comment itself.
      - name: Check /ok-to-test authorization
        id: auth
        uses: ./.github/actions/check-e2e-authorization
        with:
          pr_number: ${{ github.event.issue.number }}
          repository: ${{ github.repository }}
          event_name: ${{ github.event_name }}
          commenter_login: ${{ github.event.comment.user.login }}
          comment_id: ${{ github.event.comment.id }}

      - name: Validate authorized head sha
        if: steps.auth.outputs.authorized == 'true'
        env:
          HEAD_SHA: ${{ steps.auth.outputs.head_sha }}
        run: |
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head sha '${HEAD_SHA}'"; exit 1; }

      - name: Create the E2E checks on the PR head
        id: checks
        if: steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.auth.outputs.head_sha }}
          LIVE: ${{ steps.auth.outputs.live }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Behaviour and playback run on a GitHub emulator for every pull
          # request (behaviour-github-emulator.yml), so /ok-to-test runs only
          # Forgejo, plus the live suites when the comment asked for them.
          names=(forgejo-behaviour)
          [[ "${LIVE}" == "true" ]] && names+=(behaviour-live playback-live)
          for name in "${names[@]}"; do
            id=$(gh api -X POST "repos/${REPO}/check-runs" \
              -f name="${name}" -f head_sha="${HEAD_SHA}" -f status=in_progress \
              -f details_url="${RUN_URL}" \
              -f 'output[title]=Running after /ok-to-test' \
              -f "output[summary]=E2E ok-to-test run: ${RUN_URL}" \
              --jq .id)
            case "${name}" in
              forgejo-behaviour) key=forgejo_behaviour ;;
              behaviour-live) key=behaviour_live ;;
              playback-live) key=playback_live ;;
              *) key=${name} ;;
            esac
            echo "${key}=${id}" >> "$GITHUB_OUTPUT"
          done

      - name: Reply on the PR
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.auth.outputs.head_sha }}
          LIVE: ${{ steps.auth.outputs.live }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          suites=""
          [[ "${LIVE}" == "true" ]] && suites=", with the live behaviour and playback suites"
          body="E2E authorized for \`${HEAD_SHA}\`${suites} ([run](${RUN_URL})). A new push needs a new \`/ok-to-test <sha>\`."
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}" --silent

  run:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    # Caller permissions are a ceiling for the reusable workflow — must grant
    # the union of job perms in e2e.yml (gate / behaviour / playback /
    # forgejo-behaviour), even for the gate job that skips on issue_comment.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/e2e.yml
    with:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ needs.authorize.outputs.head_sha }}
      live: ${{ needs.authorize.outputs.live == 'true' }}
    secrets: inherit

  report:
    needs: [authorize, run]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Complete the E2E checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_RESULT: ${{ needs.run.result }}
          FORGEJO_BEHAVIOUR_ID: ${{ needs.authorize.outputs.forgejo_behaviour_check_id }}
          FORGEJO_BEHAVIOUR_RESULT: ${{ needs.run.outputs.forgejo_behaviour_result }}
          LIVE: ${{ needs.authorize.outputs.live }}
          BEHAVIOUR_LIVE_ID: ${{ needs.authorize.outputs.behaviour_live_check_id }}
          BEHAVIOUR_LIVE_RESULT: ${{ needs.run.outputs.behaviour_result }}
          PLAYBACK_LIVE_ID: ${{ needs.authorize.outputs.playback_live_check_id }}
          PLAYBACK_LIVE_RESULT: ${{ needs.run.outputs.playback_result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # job.status is success, failure or cancelled. An empty result means
          # the job never reported (the call failed to start or was cancelled).
          conclusion() {
            case "$1" in
              success|failure|cancelled) echo "$1" ;;
              *) [[ "${RUN_RESULT}" == cancelled ]] && echo cancelled || echo failure ;;
            esac
          }
          status=0
          pairs=("forgejo-behaviour:${FORGEJO_BEHAVIOUR_ID}:${FORGEJO_BEHAVIOUR_RESULT}")
          if [[ "${LIVE}" == "true" ]]; then
            pairs+=("behaviour-live:${BEHAVIOUR_LIVE_ID}:${BEHAVIOUR_LIVE_RESULT}")
            pairs+=("playback-live:${PLAYBACK_LIVE_ID}:${PLAYBACK_LIVE_RESULT}")
          fi
          for pair in "${pairs[@]}"; do
            IFS=: read -r name id result <<<"${pair}"
            [[ -n "${id}" ]] || { echo "::error::no ${name} check run id"; status=1; continue; }
            c=$(conclusion "${result}")
            if ! gh api -X PATCH "repos/${REPO}/check-runs/${id}" \
              -f status=completed -f conclusion="${c}" \
              -f "output[title]=${name}: ${c}" \
              -f "output[summary]=E2E ok-to-test run: ${RUN_URL}" --silent; then
              echo "::error::failed to complete ${name} check run ${id}"
              status=1
              continue
            fi
            echo "${name}: ${c}"
          done
          exit "${status}"
