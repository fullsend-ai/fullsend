name: E2E Tests

# PR-triggered behaviour and playback use pull_request_target for fork secrets.
# A separate gate job authorizes PRs before either suite checks out PR-head code.

permissions: {}

on:
  push:
    branches: [main]
    # SYNC-WITH: behaviour and playback relevance filters below.
    # push.paths includes both filters; each job grep may be narrower.
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - 'internal/e2etest/**'
      - 'pkg/behaviourtest/**'
      - 'internal/scaffold/fullsend-repo/**'
      - 'internal/security/hooks/**'
      - 'internal/dispatch/gcf/mintsrc/**'
      - 'internal/sentencetoken/english.json'
      - 'internal/runtime/**'
      - 'internal/sandbox/**'
      - 'internal/config/**'
      - 'internal/cli/github.go'
      - 'internal/cli/run.go'
      - 'internal/layers/**'
      - 'internal/forge/**'
      - 'internal/harness/**'
      - 'internal/dispatch/**'
      - 'internal/mintclient/**'
      - 'cmd/fullsend/**'
      - 'Makefile'
      - '.github/scripts/**'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/e2e-ok-to-test.yml'
      - '.github/workflows/reusable-dispatch.yml'
      - 'action.yml'
      - '.github/actions/check-e2e-authorization/**'
      - 'scripts/check-e2e-authorization.sh'
      - 'scripts/redact-behaviour-artifacts.sh'
  pull_request_target:
    # labeled / ok-to-test is handled by e2e-ok-to-test.yml via workflow_call.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:
    inputs:
      run_behaviour:
        description: Run the behaviour suite on the selected branch
        required: true
        type: boolean
        default: false
      run_playback:
        description: Run the playback behaviour suite
        required: true
        type: boolean
        default: true
  workflow_call:

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request_target'
        && format('e2e-{0}', github.event.pull_request.number)
        || format('{0}-{1}', github.workflow, github.ref) }}
  # Label events are auth, not a code change — never cancel an in-progress run.
  # Cancel for opened/synchronize/reopened and for non-main non-PR triggers.
  # Explicit outer parens: (A && B) || (C && D).
  cancel-in-progress: >-
    ${{ (github.event_name == 'pull_request_target'
        && github.event.action != 'labeled')
        || (github.event_name != 'pull_request_target' && github.ref != 'refs/heads/main') }}

jobs:
  gate:
    # Separate job so pull-requests: write stays out of suite jobs that
    # check out PR-head code and run behaviour/playback tests with secrets.
    # Never checkout github.event.pull_request.head.sha here.
    # workflow_call from e2e-ok-to-test.yml still has event_name pull_request_target.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}  # Base branch only — never checkout PR head in gate

      - name: Check PR authorization
        id: auth
        uses: ./.github/actions/check-e2e-authorization
        with:
          pr_number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}
          pr_updated_at: ${{ github.event.pull_request.updated_at }}
          event_action: ${{ github.event.action }}
          pr_author_association: ${{ github.event.pull_request.author_association }}
          pr_author_login: ${{ github.event.pull_request.user.login }}
          label_actor_login: ${{ github.event.sender.login }}

  behaviour-plan:
    # Plan one DEV CI job per shard, with at most 20 provisioning scenarios
    # per shard. This job runs PR-head code but receives no DEV credentials.
    needs: gate
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'merge_group') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_behaviour) ||
        (github.event_name == 'pull_request_target' && needs.gate.outputs.authorized == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ENVIRONMENT: ${{ github.event_name == 'push' && 'stage' || 'dev' }}
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: Check for behaviour-relevant changes
        id: changes
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        # SYNC-WITH: push.paths behaviour entries above
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            FILES=$(gh api "repos/${REPO}/compare/${MERGE_GROUP_BASE}...${MERGE_GROUP_HEAD}" --jq '.files[].filename') || {
              echo "::warning::Failed to fetch merge group files — running behaviour tests as a precaution"
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            FILE_COUNT=$(echo "$FILES" | wc -l)
            if [ "$FILE_COUNT" -ge 300 ]; then
              echo "::warning::Compare API returned $FILE_COUNT files (possible truncation at 300) — running behaviour tests as a precaution"
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename') || {
              echo "::warning::Failed to fetch PR files — running behaviour tests as a precaution"
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          # Any Go change runs the suite: shared dependencies extend beyond
          # the explicit non-Go paths. Keep both filters in sync and covered
          # by scripts/check-live-test-relevance-test.sh.
          if echo "$FILES" | grep -qE '\.go$|^e2e/behaviour/|^internal/e2etest/|^pkg/behaviourtest/|^internal/runtime/|^internal/sandbox/|^internal/config/|^internal/cli/|^internal/layers/|^internal/scaffold/fullsend-repo/|^internal/forge/|^internal/harness/|^internal/harnessdispatch/|^internal/normevent/|^internal/dispatch/|^internal/security/hooks/|^internal/mintclient/|^cmd/fullsend/|^go\.(mod|sum)$|^internal/sentencetoken/english\.json$|^Makefile$|^action\.yml$|^\.github/scripts/|^scripts/redact-behaviour-artifacts\.sh$|^\.github/workflows/e2e\.yml$|^\.github/workflows/e2e-ok-to-test\.yml$|^\.github/workflows/reusable-dispatch\.yml$|^\.github/actions/check-e2e-authorization/|^scripts/check-e2e-authorization\.sh$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No behaviour-relevant files changed — skipping behaviour tests"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.relevant != 'false'
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          go-version-file: go.mod

      - name: Plan behaviour shards
        id: plan
        if: steps.changes.outputs.relevant != 'false'
        shell: bash
        env:
          BEHAVIOUR_SCM: github
          BEHAVIOUR_CI: githubactions
          BEHAVIOUR_INSTALL_MODE: per-repo
          BEHAVIOUR_SHARD_PLAN_FILE: ${{ runner.temp }}/behaviour-shard-plan.json
        run: |
          make behaviour-plan
          total=$(jq -er '.total' "$BEHAVIOUR_SHARD_PLAN_FILE")
          matrix=$(jq -ec '{shard: .shards}' "$BEHAVIOUR_SHARD_PLAN_FILE")
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo '### Behaviour shard plan'
            echo
            jq -r '"\(.total) shard(s) for \(.selected) selected scenario instance(s), \(.skipped) skipped by compatibility tags, \(.provisioning) provisioning (max \(.max_provisioning_per_shard) per shard)"' "$BEHAVIOUR_SHARD_PLAN_FILE"
            echo
            jq -r '.per_shard[] | "- shard \(.index): \(.instances) instance(s), \(.provisioning) provisioning, \(.other) other"' "$BEHAVIOUR_SHARD_PLAN_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

  behaviour-shard:
    name: behaviour shard ${{ matrix.shard }}
    # Each matrix entry gets its own runner. Distinct DEV concurrency groups
    # allow shards to overlap; STAGE still shares its org with playback.
    concurrency:
      group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.event_name == 'push' && 'stage-org' || format('behaviour-dev-{0}', matrix.shard) }}
      cancel-in-progress: false
    needs: [gate, behaviour-plan]
    if: >-
      !cancelled() &&
      needs.behaviour-plan.result == 'success' &&
      needs.behaviour-plan.outputs.relevant != 'false' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'merge_group') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_behaviour) ||
        (github.event_name == 'pull_request_target' && needs.gate.outputs.authorized == 'true')
      )
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.behaviour-plan.outputs.matrix) }}
    environment: ${{ github.event_name == 'push' && 'stage' || 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ github.event_name == 'push' && 'stage' || 'dev' }}
    steps:
      - name: Record job start
        run: echo "SHARD_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.E2E_GCP_SERVICE_ACCOUNT }}

      - name: Run behaviour tests
        shell: bash
        run: |
          echo "SHARD_TEST_START=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/behaviour-artifacts"
          make behaviour-test 2>&1 | tee "${{ runner.temp }}/behaviour-artifacts/behaviour-test.log"
        env:
          BEHAVIOUR_SHARD_INDEX: ${{ matrix.shard }}
          BEHAVIOUR_SHARD_TOTAL: ${{ needs.behaviour-plan.outputs.total }}
          BEHAVIOUR_SCM: github
          BEHAVIOUR_CI: githubactions
          BEHAVIOUR_INSTALL_MODE: per-repo
          BEHAVIOUR_ARTIFACT_DIR: ${{ runner.temp }}/behaviour-artifacts
          E2E_GCP_PROJECT_ID: ${{ secrets.E2E_GCP_PROJECT_ID }}
          E2E_GCP_WIF_PROVIDER: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
          # Inference gateway BTs (#8280): the E2E test gateway URL (embeds
          # the project number, so a secret) and its echo-only API key. The
          # gateway scenarios skip when these are unset.
          E2E_INFERENCE_GATEWAY_URL: ${{ secrets.E2E_INFERENCE_GATEWAY_URL }}
          E2E_INFERENCE_GATEWAY_TEST_KEY: ${{ secrets.E2E_INFERENCE_GATEWAY_TEST_KEY }}
          # CF mint BT path: temp Worker deploy needs role PEMs + Cloudflare creds
          TEST_FULLSEND_PEM: ${{ secrets.TEST_FULLSEND_PEM }}
          TEST_TRIAGE_PEM: ${{ secrets.TEST_TRIAGE_PEM }}
          TEST_CODER_PEM: ${{ secrets.TEST_CODER_PEM }}
          TEST_REVIEW_PEM: ${{ secrets.TEST_REVIEW_PEM }}
          TEST_RETRO_PEM: ${{ secrets.TEST_RETRO_PEM }}
          TEST_PRIORITIZE_PEM: ${{ secrets.TEST_PRIORITIZE_PEM }}
          # Env names match Wrangler/mint deploy; values come from TEST_*-prefixed
          # repo secrets (not the prod site-deploy CLOUDFLARE_* secrets).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TEST_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          # Human-like actor PATs (write / triage / outsider) for behaviour SCM ops.
          # Env names match repo secret names; consumption is driver/step work (#6027).
          TEST_ACTOR_WRITE_PAT: ${{ secrets.TEST_ACTOR_WRITE_PAT }}
          TEST_ACTOR_TRIAGE_PAT: ${{ secrets.TEST_ACTOR_TRIAGE_PAT }}
          TEST_ACTOR_OUTSIDER_PAT: ${{ secrets.TEST_ACTOR_OUTSIDER_PAT }}

      - name: Record test end
        if: always()
        run: echo "SHARD_TEST_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out redaction script from base branch
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Base-branch script only — PR head must not control artifact redaction (#5221).
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
          sparse-checkout: scripts/redact-behaviour-artifacts.sh
          path: base-scripts
          persist-credentials: false

      - name: Redact secrets from behaviour debug artifacts
        id: redact
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/behaviour-artifacts
          TEST_FULLSEND_PEM: ${{ secrets.TEST_FULLSEND_PEM }}
          TEST_TRIAGE_PEM: ${{ secrets.TEST_TRIAGE_PEM }}
          TEST_CODER_PEM: ${{ secrets.TEST_CODER_PEM }}
          TEST_REVIEW_PEM: ${{ secrets.TEST_REVIEW_PEM }}
          TEST_RETRO_PEM: ${{ secrets.TEST_RETRO_PEM }}
          TEST_PRIORITIZE_PEM: ${{ secrets.TEST_PRIORITIZE_PEM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TEST_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          TEST_ACTOR_WRITE_PAT: ${{ secrets.TEST_ACTOR_WRITE_PAT }}
          TEST_ACTOR_TRIAGE_PAT: ${{ secrets.TEST_ACTOR_TRIAGE_PAT }}
          TEST_ACTOR_OUTSIDER_PAT: ${{ secrets.TEST_ACTOR_OUTSIDER_PAT }}
          E2E_GCP_PROJECT_ID: ${{ secrets.E2E_GCP_PROJECT_ID }}
          E2E_GCP_WIF_PROVIDER: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
          E2E_GCP_SERVICE_ACCOUNT: ${{ secrets.E2E_GCP_SERVICE_ACCOUNT }}
          E2E_INFERENCE_GATEWAY_URL: ${{ secrets.E2E_INFERENCE_GATEWAY_URL }}
          E2E_INFERENCE_GATEWAY_TEST_KEY: ${{ secrets.E2E_INFERENCE_GATEWAY_TEST_KEY }}
        run: |
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            LC_ALL=C \
            HOME="${{ runner.temp }}" \
            ARTIFACT_DIR="${ARTIFACT_DIR}" \
            TEST_FULLSEND_PEM="${TEST_FULLSEND_PEM}" \
            TEST_TRIAGE_PEM="${TEST_TRIAGE_PEM}" \
            TEST_CODER_PEM="${TEST_CODER_PEM}" \
            TEST_REVIEW_PEM="${TEST_REVIEW_PEM}" \
            TEST_RETRO_PEM="${TEST_RETRO_PEM}" \
            TEST_PRIORITIZE_PEM="${TEST_PRIORITIZE_PEM}" \
            CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}" \
            CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}" \
            TEST_ACTOR_WRITE_PAT="${TEST_ACTOR_WRITE_PAT}" \
            TEST_ACTOR_TRIAGE_PAT="${TEST_ACTOR_TRIAGE_PAT}" \
            TEST_ACTOR_OUTSIDER_PAT="${TEST_ACTOR_OUTSIDER_PAT}" \
            E2E_GCP_PROJECT_ID="${E2E_GCP_PROJECT_ID}" \
            E2E_GCP_WIF_PROVIDER="${E2E_GCP_WIF_PROVIDER}" \
            E2E_GCP_SERVICE_ACCOUNT="${E2E_GCP_SERVICE_ACCOUNT}" \
            E2E_INFERENCE_GATEWAY_URL="${E2E_INFERENCE_GATEWAY_URL}" \
            E2E_INFERENCE_GATEWAY_TEST_KEY="${E2E_INFERENCE_GATEWAY_TEST_KEY}" \
            /usr/bin/bash "${{ github.workspace }}/base-scripts/scripts/redact-behaviour-artifacts.sh"

      - name: Upload behaviour debug artifacts
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behaviour-artifacts-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/behaviour-artifacts/
          if-no-files-found: ignore
          retention-days: 5

      - name: Summarize shard timing
        if: always()
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.behaviour-plan.outputs.total }}
          ARTIFACT_DIR: ${{ runner.temp }}/behaviour-artifacts
          REDACT_OUTCOME: ${{ steps.redact.outcome }}
        run: |
          now=$(date +%s)
          start=${SHARD_JOB_START:-$now}
          test_start=${SHARD_TEST_START:-$now}
          test_end=${SHARD_TEST_END:-$now}
          {
            echo "### Behaviour shard ${SHARD} of ${TOTAL}"
            echo
            echo "- checkout and tool setup: $((test_start - start))s"
            echo "- behaviour-test (build, org setup, scenarios, cleanup): $((test_end - test_start))s"
            echo "- redaction and upload: $((now - test_end))s"
            echo "- job total: $((now - start))s"
          } >> "$GITHUB_STEP_SUMMARY"
          # Read only known fields from the metrics file, after redaction.
          n=$((SHARD + 1))
          metrics_file="${ARTIFACT_DIR}/shard-metrics-${n}.json"
          if [ "$REDACT_OUTCOME" = success ] && [ -f "$metrics_file" ]; then
            jq -r '"- planned: \(.planned_instances) instance(s), \(.planned_provisioning) provisioning, concurrency \(.concurrency)",
                   "- build \(.build_seconds)s, org setup \(.org_setup_seconds)s, first install \(if .first_install_seconds == null then "n/a" else "\(.first_install_seconds)s" end), body \(.body_seconds)s, cleanup \(.cleanup_seconds)s, total \(.total_seconds)s",
                   "- rate-limit failures: \(.rate_limit_failures)",
                   (.orgs[]? | "- org \(.org): capacity \(.capacity), start \(.start_quota), end \(.end_quota // "n/a")")' \
              "$metrics_file" >> "$GITHUB_STEP_SUMMARY" || true
          fi

  behaviour:
    # Keep one stable branch-protection check for the whole matrix.
    needs: [gate, behaviour-plan, behaviour-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail cancelled behaviour run
        if: ${{ cancelled() }}
        run: |
          echo '::error::Workflow was cancelled before behaviour completed'
          exit 1
      - name: Check behaviour plan and shards
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          PLAN_RESULT: ${{ needs.behaviour-plan.result }}
          RELEVANT: ${{ needs.behaviour-plan.outputs.relevant }}
          TOTAL: ${{ needs.behaviour-plan.outputs.total }}
          SHARDS_RESULT: ${{ needs.behaviour-shard.result }}
          EXPECT_PLAN: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                github.event_name == 'merge_group' ||
                (github.event_name == 'workflow_dispatch' && inputs.run_behaviour) ||
                (github.event_name == 'pull_request_target' && needs.gate.outputs.authorized == 'true') }}
        run: |
          echo "gate: ${GATE_RESULT}, plan: ${PLAN_RESULT}, relevant: ${RELEVANT:-n/a}, shards: ${TOTAL:-n/a}, shard result: ${SHARDS_RESULT}"
          case "$PLAN_RESULT" in
            skipped)
              if [ "$GATE_RESULT" = failure ] || [ "$GATE_RESULT" = cancelled ]; then
                echo "::error::Authorization gate ${GATE_RESULT}"
                exit 1
              fi
              if [ "$EXPECT_PLAN" = true ]; then
                echo '::error::Behaviour plan was skipped for an eligible run'
                exit 1
              fi
              echo '::notice::Behaviour was not requested or authorized for this event'
              exit 0
              ;;
            success) ;;
            *)
              echo "::error::Behaviour plan ${PLAN_RESULT}"
              exit 1
              ;;
          esac
          if [ "$RELEVANT" = false ]; then
            echo '::notice::No behaviour-relevant changes — shards skipped'
            exit 0
          fi
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Behaviour shards ${SHARDS_RESULT} (one or more of ${TOTAL} shard(s) failed, were cancelled or did not run)"
            exit 1
          fi
          echo "All ${TOTAL} behaviour shard(s) passed"

  playback:
    # Serialize with behaviour only on stage, whose pool has a single org.
    concurrency:
      group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.event_name == 'push' && 'stage-org' || 'playback-dev' }}
      cancel-in-progress: false
    # Manual dispatch uses the selected trusted branch and the dev environment.
    needs: gate
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'merge_group') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_playback) ||
        (github.event_name == 'pull_request_target' && needs.gate.outputs.authorized == 'true')
      )
    # Scalar form keeps default deployment: true so runs list under Environments.
    environment: ${{ github.event_name == 'push' && 'stage' || 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ github.event_name == 'push' && 'stage' || 'dev' }}
    steps:
      - name: Check for playback-relevant changes
        id: changes
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        # SYNC-WITH: push.paths behaviour entries above
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            FILES=$(gh api "repos/${REPO}/compare/${MERGE_GROUP_BASE}...${MERGE_GROUP_HEAD}" --jq '.files[].filename') || {
              echo "::warning::Failed to fetch merge group files — running playback tests as a precaution"
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            FILE_COUNT=$(echo "$FILES" | wc -l)
            if [ "$FILE_COUNT" -ge 300 ]; then
              echo "::warning::Compare API returned $FILE_COUNT files (possible truncation at 300) — running playback tests as a precaution"
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename') || {
              echo "::warning::Failed to fetch PR files — running playback tests as a precaution"
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          # Any Go change runs the suite: shared dependencies extend beyond
          # the explicit non-Go paths. Keep both filters in sync and covered
          # by scripts/check-live-test-relevance-test.sh.
          if echo "$FILES" | grep -qE '\.go$|^e2e/behaviour/|^internal/e2etest/|^pkg/behaviourtest/|^internal/runtime/|^internal/sandbox/|^internal/config/|^internal/cli/|^internal/layers/|^internal/scaffold/fullsend-repo/|^internal/forge/|^internal/harness/|^internal/harnessdispatch/|^internal/normevent/|^internal/dispatch/|^internal/security/hooks/|^internal/mintclient/|^cmd/fullsend/|^go\.(mod|sum)$|^internal/sentencetoken/english\.json$|^Makefile$|^action\.yml$|^\.github/scripts/|^scripts/redact-behaviour-artifacts\.sh$|^\.github/workflows/e2e\.yml$|^\.github/workflows/e2e-ok-to-test\.yml$|^\.github/workflows/reusable-dispatch\.yml$|^\.github/actions/check-e2e-authorization/|^scripts/check-e2e-authorization\.sh$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No playback-relevant files changed — skipping playback tests"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.relevant != 'false'
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          go-version-file: go.mod

      - name: Authenticate to GCP
        if: steps.changes.outputs.relevant != 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.E2E_GCP_SERVICE_ACCOUNT }}

      - name: Run playback tests
        id: tests
        if: steps.changes.outputs.relevant != 'false'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/playback-artifacts"
          make playback-test 2>&1 | tee "${{ runner.temp }}/playback-artifacts/playback-test.log"
        env:
          GODOG_CONCURRENCY: "1"
          BEHAVIOUR_SCM: github
          BEHAVIOUR_CI: githubactions
          BEHAVIOUR_INSTALL_MODE: per-repo
          BEHAVIOUR_ARTIFACT_DIR: ${{ runner.temp }}/playback-artifacts
          E2E_GCP_PROJECT_ID: ${{ secrets.E2E_GCP_PROJECT_ID }}
          E2E_GCP_WIF_PROVIDER: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
          # CF mint BT path: temp Worker deploy needs role PEMs + Cloudflare creds
          TEST_FULLSEND_PEM: ${{ secrets.TEST_FULLSEND_PEM }}
          TEST_TRIAGE_PEM: ${{ secrets.TEST_TRIAGE_PEM }}
          TEST_CODER_PEM: ${{ secrets.TEST_CODER_PEM }}
          TEST_REVIEW_PEM: ${{ secrets.TEST_REVIEW_PEM }}
          TEST_RETRO_PEM: ${{ secrets.TEST_RETRO_PEM }}
          TEST_PRIORITIZE_PEM: ${{ secrets.TEST_PRIORITIZE_PEM }}
          # Env names match Wrangler/mint deploy; values come from TEST_*-prefixed
          # repo secrets (not the prod site-deploy CLOUDFLARE_* secrets).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TEST_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          # Human-like actor PATs (write / triage / outsider) for behaviour SCM ops.
          # Env names match repo secret names; consumption is driver/step work (#6027).
          TEST_ACTOR_WRITE_PAT: ${{ secrets.TEST_ACTOR_WRITE_PAT }}
          TEST_ACTOR_TRIAGE_PAT: ${{ secrets.TEST_ACTOR_TRIAGE_PAT }}
          TEST_ACTOR_OUTSIDER_PAT: ${{ secrets.TEST_ACTOR_OUTSIDER_PAT }}

      - name: Check out redaction script from base branch
        if: always() && steps.changes.outputs.relevant != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Base-branch script only — PR head must not control artifact redaction (#5221).
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
          sparse-checkout: scripts/redact-behaviour-artifacts.sh
          path: base-scripts
          persist-credentials: false

      - name: Redact secrets from playback debug artifacts
        id: redact
        if: always() && steps.changes.outputs.relevant != 'false'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/playback-artifacts
          TEST_FULLSEND_PEM: ${{ secrets.TEST_FULLSEND_PEM }}
          TEST_TRIAGE_PEM: ${{ secrets.TEST_TRIAGE_PEM }}
          TEST_CODER_PEM: ${{ secrets.TEST_CODER_PEM }}
          TEST_REVIEW_PEM: ${{ secrets.TEST_REVIEW_PEM }}
          TEST_RETRO_PEM: ${{ secrets.TEST_RETRO_PEM }}
          TEST_PRIORITIZE_PEM: ${{ secrets.TEST_PRIORITIZE_PEM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TEST_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          TEST_ACTOR_WRITE_PAT: ${{ secrets.TEST_ACTOR_WRITE_PAT }}
          TEST_ACTOR_TRIAGE_PAT: ${{ secrets.TEST_ACTOR_TRIAGE_PAT }}
          TEST_ACTOR_OUTSIDER_PAT: ${{ secrets.TEST_ACTOR_OUTSIDER_PAT }}
          E2E_GCP_PROJECT_ID: ${{ secrets.E2E_GCP_PROJECT_ID }}
          E2E_GCP_WIF_PROVIDER: ${{ secrets.E2E_GCP_WIF_PROVIDER }}
          E2E_GCP_SERVICE_ACCOUNT: ${{ secrets.E2E_GCP_SERVICE_ACCOUNT }}
        run: |
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            LC_ALL=C \
            HOME="${{ runner.temp }}" \
            ARTIFACT_DIR="${ARTIFACT_DIR}" \
            TEST_FULLSEND_PEM="${TEST_FULLSEND_PEM}" \
            TEST_TRIAGE_PEM="${TEST_TRIAGE_PEM}" \
            TEST_CODER_PEM="${TEST_CODER_PEM}" \
            TEST_REVIEW_PEM="${TEST_REVIEW_PEM}" \
            TEST_RETRO_PEM="${TEST_RETRO_PEM}" \
            TEST_PRIORITIZE_PEM="${TEST_PRIORITIZE_PEM}" \
            CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}" \
            CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}" \
            TEST_ACTOR_WRITE_PAT="${TEST_ACTOR_WRITE_PAT}" \
            TEST_ACTOR_TRIAGE_PAT="${TEST_ACTOR_TRIAGE_PAT}" \
            TEST_ACTOR_OUTSIDER_PAT="${TEST_ACTOR_OUTSIDER_PAT}" \
            E2E_GCP_PROJECT_ID="${E2E_GCP_PROJECT_ID}" \
            E2E_GCP_WIF_PROVIDER="${E2E_GCP_WIF_PROVIDER}" \
            E2E_GCP_SERVICE_ACCOUNT="${E2E_GCP_SERVICE_ACCOUNT}" \
            /usr/bin/bash "${{ github.workspace }}/base-scripts/scripts/redact-behaviour-artifacts.sh"

      - name: Upload playback debug artifacts
        if: always() && steps.tests.outcome == 'failure' && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playback-artifacts-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/playback-artifacts/
          if-no-files-found: ignore
          retention-days: 5
