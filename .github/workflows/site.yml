name: Site

# Build the public site, then deploy it. Cloudflare secrets stay off the runner
# that executes PR-controlled code (npm ci, npx mvb). Deploy jobs check out a
# trusted tree so wrangler.toml is never taken from a PR, and copy only public/
# and worker/ from the build artifact. Fork PRs skip deploy-preview: pull_request
# from a fork does not receive repository secrets.

on:
  pull_request:
    paths:
      - "web/**"
      - "docs/**"
      - "cloudflare_site/**"
      - "package.json"
      - "package-lock.json"
      - "experiments"
      - "experiments/**"
      - ".gitmodules"
      - ".github/workflows/site.yml"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Cold multi-version doc builds (mvb) on main need headroom to finish and save the cache.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      # Caches are immutable: save is a no-op if the primary key already exists.
      # Unique time-based key + restore-keys is the documented way to persist an
      # updated tree; restore-keys then takes the most recently created prefix
      # match (the last main save, which has the most tagged versions).
      # Save only on main, and only when mvb wrote new per-tag artifacts.
      - name: Compute mvb cache key
        id: mvb-key
        run: echo "key=lando-mvb-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.mvb-key.outputs.key }}
          restore-keys: |
            lando-mvb-
          path: docs/.vitepress/cache/@lando/mvb

      - name: Snapshot restored mvb cache
        id: mvb-before
        env:
          MVB_CACHE: docs/.vitepress/cache/@lando/mvb
        run: |
          set -euo pipefail
          mkdir -p "$MVB_CACHE"
          hash=$(find "$MVB_CACHE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | sha256sum | awk '{print $1}')
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      - name: Build documentation site
        run: |
          git submodule update --init
          npx mvb docs
        env:
          VPL_MVB_BRANCH: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p _bundle/public
          cp web/public/index.html _bundle/public/index.html
          cp web/public/graph.html _bundle/public/graph.html
          cp web/public/404.html _bundle/public/404.html
          mkdir -p _bundle/public/docs
          cp -a docs/.vitepress/dist/. _bundle/public/docs/
          cp -a cloudflare_site/public/. _bundle/public/
          mkdir -p _bundle/worker
          cp -a cloudflare_site/worker/. _bundle/worker/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _bundle/
          retention-days: 5

      - name: Detect new mvb version artifacts
        id: mvb-after
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MVB_CACHE: docs/.vitepress/cache/@lando/mvb
          BEFORE: ${{ steps.mvb-before.outputs.hash }}
        run: |
          set -euo pipefail
          mkdir -p "$MVB_CACHE"
          hash=$(find "$MVB_CACHE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | sha256sum | awk '{print $1}')
          if [[ "$hash" != "$BEFORE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mvb-after.outputs.changed == 'true'
        with:
          key: ${{ steps.mvb-key.outputs.key }}
          path: docs/.vitepress/cache/@lando/mvb

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # npm ci + Wrangler deploy; headroom for cache misses.
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Trusted tree only: wrangler.toml must not come from PR checkout (no PR-controlled [build] on the deploy runner).
      # PR Worker + static files ship in the build artifact under _bundle/; we copy only public/ and worker/ (never extract TOML from the zip into cloudflare_site/).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _bundle

      - name: Apply artifact to Cloudflare project
        run: |
          set -euo pipefail
          if [[ ! -d _bundle ]]; then
            echo "::error::Missing _bundle after artifact download"
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            b=$(basename "$entry")
            if [[ "$b" != "public" && "$b" != "worker" ]]; then
              echo "::error::Disallowed path in site artifact: $b (only public/ and worker/ may exist at the top level of _bundle/)"
              exit 1
            fi
            if [[ ! -d "$entry" ]]; then
              echo "::error::_bundle/$b must be a directory"
              exit 1
            fi
          done < <(find _bundle -mindepth 1 -maxdepth 1 -print0)
          if [[ ! -d _bundle/public ]] || [[ ! -d _bundle/worker ]]; then
            echo "::error::Artifact must contain _bundle/public/ and _bundle/worker/"
            exit 1
          fi
          mkdir -p cloudflare_site/public cloudflare_site/worker
          cp -a _bundle/public/. cloudflare_site/public/
          cp -a _bundle/worker/. cloudflare_site/worker/

      # The site Worker is a static-asset passthrough: no vars or secrets are required.
      - name: Deploy to production (Workers + static assets)
        id: cf-prod
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: "4.128.0"
          workingDirectory: cloudflare_site
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy --name="${{ vars.CLOUDFLARE_PROJECT_NAME }}"

      - name: Upload preview version (Workers + static assets)
        id: cf-preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: "4.128.0"
          workingDirectory: cloudflare_site
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: >-
            versions upload
            --name="${{ vars.CLOUDFLARE_PROJECT_NAME }}"
            --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Resolve deployment URL
        id: meta
        if: >-
          (steps.cf-prod.outcome == 'success' || steps.cf-preview.outcome == 'success')
        env:
          URL_PROD: ${{ steps.cf-prod.outputs.deployment-url }}
          URL_PREVIEW: ${{ steps.cf-preview.outputs.deployment-url }}
          OUT_PROD: ${{ steps.cf-prod.outputs.command-output }}
          ERR_PROD: ${{ steps.cf-prod.outputs.command-stderr }}
          OUT_PR: ${{ steps.cf-preview.outputs.command-output }}
          ERR_PR: ${{ steps.cf-preview.outputs.command-stderr }}
          ALIAS_TOKEN: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
        run: |
          set -euo pipefail
          comb="${OUT_PROD:-}${ERR_PROD:-}${OUT_PR:-}${ERR_PR:-}"
          url=""
          # wrangler-action's deployment-url is the versioned hostname
          # (https://<version-id>-site....workers.dev). Prefer the preview-alias
          # URL from Wrangler output when this is a PR upload.
          if [[ -n "${ALIAS_TOKEN:-}" ]]; then
            url=$(printf '%s' "$comb" | grep -oE 'https://[a-zA-Z0-9._/?#&=%_-]+' | grep -E '\.workers\.dev(/|$)' | grep -F "$ALIAS_TOKEN" | head -1 || true)
          fi
          if [ -z "$url" ]; then
            url="${URL_PROD:-}"
          fi
          if [ -z "$url" ]; then
            url="${URL_PREVIEW:-}"
          fi
          if [ -z "$url" ]; then
            url=$(printf '%s' "$comb" | grep -oE 'https://[a-zA-Z0-9._/?#&=%_-]+' | grep -E '\.workers\.dev(/|$)' | head -1 || true)
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine Workers deployment URL from Wrangler output"
            exit 1
          fi
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Validate preview deployment URL (alias vs versioned URL)
        if: >-
          github.event_name == 'pull_request' &&
          steps.cf-preview.outcome == 'success' &&
          steps.meta.outcome == 'success'
        env:
          URL: ${{ steps.meta.outputs.deployment_url }}
          ALIAS_TOKEN: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "${ALIAS_TOKEN:-}" ]]; then
            exit 0
          fi
          if [[ "$URL" != *"$ALIAS_TOKEN"* ]]; then
            echo "::warning::Preview deployment URL does not include alias token '${ALIAS_TOKEN}' (got: ${URL}). wrangler-action may be returning a versioned URL instead of the preview-alias hostname; confirm in Cloudflare or Wrangler structured output."
          fi

      - name: GitHub Deployment + preview comment
        if: steps.meta.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.meta.outputs.deployment_url }}
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.HEAD_SHA;
            const environment = isPR ? 'site-preview' : 'site-production';
            const url = process.env.DEPLOYMENT_URL;
            if (!url) {
              core.setFailed('Missing deployment URL after Workers deploy/upload');
              return;
            }
            if (!sha) {
              core.setFailed('Missing HEAD_SHA for GitHub Deployment');
              return;
            }

            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: sha,
              environment,
              auto_merge: false,
              required_contexts: [],
              transient_environment: isPR,
              production_environment: !isPR,
            });
            const deploymentId = deployment.data.id;

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: url,
              description: 'Cloudflare Workers (static assets)',
              auto_inactive: isPR,
            });

            if (!isPR) return;

            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- site-preview -->';
            const body = [
              marker,
              '### Site preview',
              '',
              `**Preview:** ${url}`,
              '',
              `Commit: \`${sha}\``,
            ].join('\n');

            let existing = null;
            for (let page = 1; page <= 20; page++) {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
                page,
              });
              existing = comments.find((c) => c.body?.includes(marker));
              if (existing || comments.length < 100) break;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
